lass="subtitle">防护判断仅针对当前路径</span></div><h3>${f.defense}</h3><p class="subtitle" style="margin-top:12px;line-height:2">${f.suggestion}</p><div class="notice" style="margin-top:20px">缺失实现、超时或未解析调用不能解释为有效防护。单一路径被阻断不代表整个项目安全。</div></div>`}<div class="evidence-summary">${ic(f.state==='risk'?'alert':f.state==='safe'?'shield':'help')}<div><strong>${statusLabel(f.state)} · ${f.state==='risk'?'静态证据支持':f.state==='safe'?'当前路径的污染传播已被阻断':'存在尚未解决的关键证据'}</strong><p>${f.summary}</p></div></div><div class="codehead"><span>${ic('file')} <span class="mono">${activeNode<2?'controller/'+f.controller+'.java':activeNode===2?'service/'+f.service+'.java':(f.file.includes('Mapper')?'mapper/':f.file.includes('Repository')?'repository/':'service/')+f.file}</span></span><div class="row"><span>只读快照</span><button class="icon-btn" data-action="copycode" title="复制源码片段">${ic('copy')}</button></div></div><div class="codebox">${codeLines(f).map(([n,c,h])=>`<div class="code-line ${h?'hl':''}"><span class="lineno">${n}</span><span class="code-content">${highlight(c)}</span></div>`).join('')}</div>${r?.note?`<div class="review-note">${ic('edit')} 审计备注：${esc(r.note)}</div>`:''}<div class="detail-foot"><span>${ic('lock')} 证据绑定快照 ${esc(current().commit)}</span><button class="link-btn" data-action="report">在报告中查看 ${ic('arrow')}</button></div>`}
function highlight(s){return esc(s).replace(/(&quot;.*?&quot;)/g,'<span class="str">$1</span>').replace(/\b(public|private|return|class|new)\b/g,'<span class="kw">$1</span>').replace(/(\/\/.*)$/,'<span class="cmt">$1</span>')}
function renderProjects(){return head('项目总览','管理你的审计项目，让每一次分析都有清晰的起点。',btn('导入项目','new','plus','primary'),'YOUR AUDIT PROJECTS')+stats([['审计项目',String(projects.length).padStart(2,'0')+'<em>个</em>','本地独立管理的源码快照','folder'],['审计发现','12<em>项</em>','跨项目累计候选风险点','scan'],['已完成审计','02<em>次</em>','分析结果与报告已保存','shield'],['最近审计','14:32','今天 · mall-admin','clock']])+`<div class="section-title"><h2>最近项目</h2><span class="subtitle">按最近审计时间排序</span></div><div class="section-grid">${projects.map(p=>`<div class="panel project-card"><div class="project-card-top"><div class="project-icon">${ic('folder')}</div><span class="tag ${p.status==='已完成'?'green':'orange'}">${p.status}</span></div><div class="project-name">${esc(p.name)}</div><div class="project-desc mono">${esc(p.repo)}</div><div class="row" style="margin-top:13px"><span class="tag">${p.lang}</span><span class="tag">${esc(p.branch)}</span></div><div class="project-row"><span>${p.loc} 行代码</span><span>${p.date}</span></div><div class="project-actions">${btn('进入工作台','openproject','arrow','small primary',`data-project="${p.id}"`)}${btn('查看报告','projectreport','report','small',`data-project="${p.id}"`)}</div></div>`).join('')}<button class="add-project" data-action="new">${ic('plus')}<span>导入一个新项目</span><small>公开 GitHub 仓库 / 本地源码目录</small></button></div><div class="section-title"><h2>审计记录</h2><button class="link-btn" data-route="reports">查看报告 ${ic('arrow')}</button></div><div class="panel table-wrap"><table class="table"><thead><tr><th>项目 / 任务</th><th>审计范围</th><th>查询方式</th><th>状态</th><th>风险</th><th>操作</th></tr></thead><tbody>${projects.map(p=>`<tr><td><strong>${esc(p.name)}</strong><div class="mono" style="color:#7d97b8">${esc(p.commit)}</div></td><td>SQL · 命令 · 路径</td><td>Java LSP + rg</td><td><span class="tag green">${p.status}</span></td><td>4 成立 / 1 阻断 / 1 待查</td><td>${btn('查看','openproject','arrow','small',`data-project="${p.id}"`)}</td></tr>`).join('')}</tbody></table></div>`}
function renderReports(){const p=current();return head('审计报告','把分析过程沉淀为可复核、可交付的安全证据。',btn('导出 JSON','exportjson','download')+btn('导出 HTML 报告','exporthtml','download','primary'),'EVIDENCE-BASED REPORT')+`<div class="report-layout"><section class="panel report-sheet"><div class="row between"><span class="report-kicker">PI-AUDIT-HARNESS / SECURITY REPORT</span><span class="tag ${task.state==='complete'?'green':'orange'}">${task.state==='complete'?'完整报告':'阶段报告'}</span></div><h2>${esc(p.name)}<br>源码安全审计报告</h2><p class="subtitle">Java / Spring · ${esc(p.branch)} · 快照 ${esc(p.commit)}</p><div class="report-line"></div><div class="row wrap"><span class="tag red">4 条风险成立</span><span class="tag green">1 条路径阻断</span><span class="tag orange">1 条证据不足</span><span class="tag">${Object.keys(reviews).length} 项已复核</span></div><div class="report-summary">本次围绕 SQL 注入、命令注入、路径遍历三类规则识别 6 个候选风险点。其中 4 条路径具备静态风险证据，1 条路径存在有效防护，1 条路径需要补充依赖实现。<br>以下内容为交互原型模拟数据，用于评审产品流程，不构成真实项目的安全结论。</div><h3 style="margin:25px 0 13px">01 / 风险发现与证据</h3>${findings.map((f,i)=>`<div class="report-finding"><div class="row between"><h3>${String(i+1).padStart(2,'0')}. ${f.title}</h3>${statusTag(f.state)}</div><p>${f.summary}</p><div class="report-mini-chain"><span>HTTP ${f.source}</span>→<span>${f.controller}</span>→<span>${f.service}</span>→<span>${f.sink}</span></div><p><span class="mono">${f.file}:${f.line}</span> · ${f.cwe} · ${reviews[f.id]?.status||'未复核'}</p>${reviews[f.id]?.note?`<p>人工备注：${esc(reviews[f.id].note)}</p>`:''}<button class="report-view-btn" data-action="viewfinding" data-id="${f.id}">查看完整调用链 ${ic('arrow')}</button></div>`).join('')}<h3 style="margin:25px 0 10px">02 / 分析范围与限制</h3><p class="subtitle" style="line-height:2">结论仅覆盖当前源码快照及已分析路径。反射、动态分派和缺少源码的外部依赖可能影响分析完整性。证据不足不等同于安全；本报告不包含动态利用验证。</p></section><aside class="panel report-side"><h3>报告信息</h3><dl class="definition"><dt>项目</dt><dd>${esc(p.name)}</dd><dt>快照</dt><dd class="mono">${esc(p.commit)}</dd><dt>规则包</dt><dd>Java Web v1.0</dd><dt>查询后端</dt><dd>${lsp?'JDT-LS + rg':'rg 基础搜索'}</dd><dt>参考模型</dt><dd>${esc(model?.id||'未配置 · 演示数据')}</dd><dt>用量</dt><dd>12,840 tokens（模拟）</dd><dt>结束原因</dt><dd>${task.state==='complete'?'工作项全部结束':'用户停止 / 仍有待办'}</dd></dl><div class="notice">报告保留源码快照、路径证据和人工复核结果。导出 HTML 可独立打开。</div>${btn('导出 HTML','exporthtml','download','primary')}${btn('导出结构化 JSON','exportjson','code')}</aside></div>`}

function markdownPreview(value){return String(value||'').split('\n').map(line=>{if(/^#{1,6}\s/.test(line))return '<h4>'+esc(line.replace(/^#{1,6}\s+/,''))+'</h4>';if(/^\s*[-*]\s/.test(line))return '<p>• '+esc(line.replace(/^\s*[-*]\s+/,''))+'</p>';return line.trim()?'<p>'+esc(line)+'</p>':''}).join('')||'<p>填写审计说明后，在这里查看预览。</p>'}
function parseTemplateDocument(text,filename){let front={},body=text.replace(/^\uFEFF/,'');const match=body.match(/^---\s*\r?\n([\s\S]*?)\r?\n---\s*(?:\r?\n|$)/);if(match){for(const line of match[1].split(/\r?\n/)){const m=line.match(/^([a-zA-Z_-]+):\s*(.*)$/);if(m)front[m[1]]=m[2].trim().replace(/^['"]|['"]$/g,'')}body=body.slice(match[0].length)}const heading=body.match(/^#\s+(.+)$/m);return {name:front.name||heading?.[1]||filename.replace(/\.md$/i,''),description:front.description||'',content:body.trim(),language:front.language||'Java / Spring'}}

function templatePreview(){return `<div class="compose-preview-label">LIVE PREVIEW / 审计模板</div><h3>${esc(templateDraft.name||'你的审计模板')}</h3><div class="row wrap" style="margin:13px 0 17px"><span class="tag">${esc(templateDraft.language)}</span><span class="tag orange">自定义 / 未验证</span></div><p class="compose-subtitle">${esc(templateDraft.description||'描述这个模板适用的场景和审计重点。')}</p><div class="markdown-preview">${markdownPreview(templateDraft.content)}</div><div class="notice" style="margin-top:24px">创建后可在新建审计中选用。模板提供审查知识与步骤，不执行其中的脚本、安装命令或外部链接。</div>`}
function renderTemplateComposer(){modal(templateEditId?'编辑审计模板':'新增审计模板',`<div class="compose-layout"><section class="compose-editor"><div class="compose-tabs">${[['manual','edit','手动编写'],['markdown','file','Markdown'],['skill','folder','Skill']].map(([k,i,n])=>`<button class="${templateSource===k?'active':''}" data-action="templatesource" data-source="${k}">${ic(i)}${n}</button>`).join('')}</div>${templateSource!=='manual'?`<div class="import-zone">${ic(templateSource==='skill'?'folder':'file')}<h3>${templateSource==='skill'?'导入已有 Skill':'导入 Markdown 文档'}</h3><p>${templateSource==='skill'?'选择 SKILL.md，或选择包含 SKILL.md 的 Skill 目录。<br>只导入文档，关联文件仅列出名称，不执行脚本。':'选择 .md / .markdown 文档，标题与说明会自动填入。<br>导入后仍可编辑内容，不需要编写 JSON。'}</p><div class="row wrap" style="justify-content:center">${btn(templateSource==='skill'?'选择 SKILL.md':'选择 Markdown 文档','picktemplatedoc','file','small')}${templateSource==='skill'?btn('选择 Skill 目录','pickskillfolder','folder','small'):''}${btn('使用示例','exampletemplatedoc',null,'small')}</div></div>`:''}${templateDraft.originFile?`<div class="loaded-file">${ic('file')}<div>${esc(templateDraft.originFile)}<small>${esc(templateDraft.fileInfo||'文档已载入，可继续编辑')}</small></div></div>`:''}<div class="field-grid"><div class="field"><label for="tplname">模板名称 *</label><input class="input" id="tplname" placeholder="例如：SSRF 审计" value="${esc(templateDraft.name)}"></div><div class="field"><label for="tplcategory">漏洞分类</label><select class="input" id="tplcategory">${['自定义','CWE-89','CWE-78','CWE-22','CWE-918'].map(x=>`<option ${templateDraft.category===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field-grid"><div class="field"><label for="tpllanguage">适用语言</label><select class="input" id="tpllanguage">${['Java / Spring','通用审计知识','Python（后续）','TypeScript（后续）','Go（后续）'].map(x=>`<option ${templateDraft.language===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="tpldesc">简要说明</label><input class="input" id="tpldesc" value="${esc(templateDraft.description)}" placeholder="描述适用场景与关注点"></div></div><div class="field"><div class="row between"><label for="tplcontent">审计说明 · Markdown *</label><button class="link-btn" data-action="fillmarkdown">填入写作骨架</button></div><textarea class="input" id="tplcontent" placeholder="# 审计目标&#10;&#10;## 审查步骤&#10;&#10;## 输出要求">${esc(templateDraft.content)}</textarea></div><p class="import-notes">可以直接编写，也可以导入 Markdown 或 Skill 后修改。无需理解底层规则配置格式。</p></section><aside class="compose-preview" id="templatepreview">${templatePreview()}</aside></div>`,`<span class="subtitle" style="font-size:10px">${templateEditId?'编辑现有文档':'创建本地审计知识模板'} · 不发送给模型</span><div class="row">${btn('取消','close')}${btn(templateEditId?'保存修改':'创建模板','savetemplatedocument','check','primary')}</div>`,true);document.querySelector('#modal').className='template-compose'}
async function readTemplateFiles(files,skillFolder=false){const list=Array.from(files);let file=skillFolder?list.find(f=>/(^|\/)SKILL\.md$/i.test(f.webkitRelativePath||f.name)):list[0];if(!file){toast('该目录未找到 SKILL.md，请选择 Skill 根目录',true);return}if(!/\.(md|markdown)$/i.test(file.name)){toast('请选择 Markdown 或 SKILL.md 文档',true);return}if(file.size>512*1024){toast('文档请控制在 512 KB 以内',true);return}captureTemplateDraft();try{const text=await file.text();if(!text.trim()){toast('文档内容为空',true);return}const doc=parseTemplateDocument(text,file.name);templateDraft={...templateDraft,name:doc.name,description:doc.description,language:['Java / Spring','通用审计知识'].includes(doc.language)?doc.language:'Java / Spring',content:doc.content,originFile:skillFolder?(file.webkitRelativePath||file.name):file.name,fileInfo:skillFolder?`${list.length} 个文件 · 仅读取 SKILL.md；未执行其他文件`:`${(file.size/1024).toFixed(1)} KB · Markdown 文档`};templateDraft.source=skillFolder||/^SKILL\.md$/i.test(file.name)?'skill':'markdown';templateSource=templateDraft.source;renderTemplateComposer();toast('文档已载入，可预览、编辑后创建模板')}catch(err){toast('无法读取文档，请重新选择',true)}}

function formModel(){return {name:document.querySelector('#modelname').value.trim(),url:document.querySelector('#modelurl').value.trim(),id:document.querySelector('#modelid').value.trim()}}
document.addEventListener('click',e=>{const route=e.target.closest('[data-route]');if(route){go(route.dataset.route);return}const fi=e.target.closest('[data-finding]');if(fi){selected=fi.dataset.finding;activeNode=2;detailTab='chain';renderRiskList();renderDetail();return}const fil=e.target.closest('[data-filter]');if(fil){filter=fil.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b===fil));renderRiskList();return}const tab=e.target.closest('[data-tab]');if(tab){detailTab=tab.dataset.tab;renderDetail();return}const node=e.target.closest('[data-node]');if(node){activeNode=+node.dataset.node;renderDetail();return}const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;
switch(action){
case 'new':newStep=1;newSource='github';draft={name:'',url:'',path:'',query:lsp?'lsp':'grep',prompt:''};newAudit();break;
case 'close':closeModal();break;
case 'newsource':captureDraft();newSource=el.dataset.value;newAudit();break;
case 'exampleproject':document.querySelector('#newname').value='spring-demo';document.querySelector('#newurl').value='https://github.com/example/spring-demo';break;
case 'examplefolder':captureDraft();draft.path='D:/workspace/spring-demo';if(!draft.name)draft.name='spring-demo';newAudit();break;
case 'pickfolder':document.querySelector('#folderpicker').click();break;
case 'newnext':captureDraft();if(newStep===1){if(!draft.name){toast('请输入项目名称',true);return}if(newSource==='github'&&!/^https:\/\/github\.com\/[^\s/]+\/[^\s/]+\/?$/.test(draft.url)){toast('请输入公开 GitHub 仓库链接，或使用示例项目',true);return}if(newSource==='local'&&!draft.path){toast('请选择文件夹或使用示例目录',true);return}}if(newStep===2&&!templates.some(t=>t.enabled)){toast('请至少选择一种漏洞模板',true);return}newStep++;newAudit();break;
case 'newback':captureDraft();newStep--;newAudit();break;
case 'startrun':startRun();break;
case 'pause':task.state='paused';document.querySelector('#runbar').innerHTML=runbar();toast('模拟审计已暂停，当前进度已保留');break;
case 'resume':task.state='running';if(task.percent>=100)task.percent=0;if(page!=='audit')go('audit');else render();tickTask();toast('已继续模拟审计');break;
case 'stop':modal('停止当前审计？',`<p>已完成风险点的证据和结论会保留，可导出阶段报告，或稍后从检查点继续。</p><div class="notice" style="margin-top:16px">当前模拟进度：${task.percent}% · ${esc(task.phase)}</div>`,`<span></span><div class="row">${btn('继续审计','close')}${btn('确认停止','confirmstop','stop','danger')}</div>`);break;
case 'confirmstop':task.state='stopped';clearInterval(taskTimer);closeModal();render();toast('已停止，阶段结果已保留');break;
case 'report':go('reports');break;
case 'openproject':activeProject=el.dataset.project;go('audit');break;
case 'projectreport':activeProject=el.dataset.project;go('reports');break;
case 'viewfinding':selected=el.dataset.id;detailTab='chain';activeNode=2;go('audit');break;
case 'clearfilter':filter='all';search='';render();break;
case 'review':review();break;
case 'savereview':reviews[selected]={status:document.querySelector('#reviewstatus').value,note:document.querySelector('#reviewnote').value.trim()};store.set('reviews',reviews);closeModal();renderRiskList();renderDetail();toast('人工复核结果已保存');break;
case 'zoomin':zoom=Math.min(1.6,zoom+.1);renderDetail();break;
case 'zoomout':zoom=Math.max(.7,zoom-.1);renderDetail();break;
case 'zoomreset':zoom=1;renderDetail();break;
case 'copycode':{const text=codeLines(currentFinding()).map(x=>x[1]).join('\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('源码片段已复制')).catch(()=>modal('源码片段',`<textarea class="input" readonly>${esc(text)}</textarea>`));else modal('源码片段',`<textarea class="input" readonly>${esc(text)}</textarea>`);break}
case 'guide':guide();break;
case 'gotomodels':closeModal();go('models');break;
case 'togglekey':{const x=document.querySelector('#modelkey');x.type=x.type==='password'?'text':'password';break}
case 'testmodel':{const m=formModel();if(!m.url||!m.id||!document.querySelector('#modelkey').value){toast('请填写地址、模型 ID 和示例 Key 后再测试',true);return}try{if(!['https:','http:'].includes(new URL(m.url).protocol))throw Error()}catch{toast('请输入有效的 http(s) 服务地址',true);return}secret=document.querySelector('#modelkey').value;el.disabled=true;el.innerHTML='<i class="loading-ring"></i> 模拟检查中';const result=document.querySelector('#testresult');setTimeout(()=>{if(document.contains(el)){el.disabled=false;el.innerHTML=ic('play')+'模拟测试连接';result.innerHTML='<div class="test-result">'+ic('check')+' 模拟测试通过 · 展示接口与工具调用可用的反馈。未发起网络请求。</div>'}},800);break}
case 'deletemodel':modal('删除模型配置？','<p>将清除本浏览器保存的配置元数据及本次页面内存中的示例密钥。</p>',`<span></span><div class="row">${btn('取消','close')}${btn('删除配置','confirmdeletemodel',null,'danger')}</div>`);break;
case 'confirmdeletemodel':model=null;secret='';store.set('model',null);closeModal();render();toast('模型配置已删除');break;
case 'toggletemplate':{const t=templates.find(x=>x.id===el.dataset.id);t.enabled=!t.enabled;store.set('templates',templates);render();toast(t.name+(t.enabled?'模板已启用':'模板已停用'));break}
case 'newtemplate':openTemplateComposer('manual');break;
case 'importtemplate':openTemplateComposer('markdown');break;
case 'edittemplate':openTemplateComposer('manual',el.dataset.id);break;
case 'templatesource':captureTemplateDraft();templateSource=el.dataset.source;templateDraft.source=templateSource;renderTemplateComposer();break;
case 'picktemplatedoc':document.querySelector('#templatefile').value='';document.querySelector('#templatefile').click();break;
case 'pickskillfolder':document.querySelector('#skillfolderpicker').value='';document.querySelector('#skillfolderpicker').click();break;
case 'fillmarkdown':captureTemplateDraft();templateDraft.content=markdownExample;renderTemplateComposer();break;
case 'exampletemplatedoc':{const skill=templateSource==='skill';const text='---\nname: ssrf-audit\ndescription: 检查用户可控 URL 的请求、跳转和内部网络访问约束。\n---\n# SSRF 审计\n\n## 审计目标\n识别外部输入是否能够控制服务端发起的网络请求。\n\n## 审查步骤\n- 定位 URL 输入及 HTTP 客户端调用。\n- 检查协议、目标地址、重定向和 DNS 解析约束。\n- 逐层核实封装函数中的参数传播。\n\n## 输出要求\n记录完整路径和源码证据；缺少实现时保留未知。';const d=parseTemplateDocument(text,skill?'SKILL.md':'ssrf-audit.md');templateDraft={...templateDraft,name:'SSRF 审计',description:d.description,content:d.content,category:'CWE-918',originFile:skill?'ssrf-audit/SKILL.md':'ssrf-audit.md',source:templateSource,fileInfo:'示例文档 · 仅载入文本'};renderTemplateComposer();break}
case 'savetemplatedocument':{captureTemplateDraft();if(!templateDraft.name.trim()||!templateDraft.content.trim()){toast('请填写模板名称和审计说明',true);return}const existing=templateEditId?templates.find(t=>t.id===templateEditId):null;const item={...(existing||{}),id:existing?.id||'custom-'+Date.now(),name:templateDraft.name.trim(),custom:existing?.custom??true,cwe:templateDraft.category,icon:existing?.icon||'file',enabled:existing?.enabled??true,language:templateDraft.language,desc:templateDraft.description.trim()||'用户编写的审计知识与检查步骤。',prompt:templateDraft.content,originFile:templateDraft.originFile||'audit-template.md',source:templateDraft.source};if(existing)Object.assign(existing,item);else templates.push(item);store.set('templates',templates);closeModal();if(page==='templates')render();toast(existing?'审计模板已更新':'审计模板已创建，可在新建审计中选用');break}
case 'templatehelp':modal('用 Markdown 编写审计模板',`<p class="subtitle">像写审计笔记一样描述你的方法，或直接导入已有 Skill。</p><div class="guide-step"><b>1</b><div><h3>说明审计目标</h3><p>描述要检查的漏洞和适用的语言 / 框架。</p></div></div><div class="guide-step"><b>2</b><div><h3>写下查证步骤</h3><p>列出入口、危险操作、防护及需要重点检查的封装。</p></div></div><div class="guide-step"><b>3</b><div><h3>定义输出要求</h3><p>要求给出路径、源码位置、参数映射与未知项。</p></div></div><div class="notice" style="margin-top:15px">Skill 选择 SKILL.md 或整个目录；只将文档内容载入模板，不执行关联脚本。Markdown 中的 HTML 按文本显示。</div>`,`<span></span>${btn('创建一个模板','newtemplate','plus','primary')}`);break;
case 'tooldetail':modal(el.dataset.tool==='pi'?'Pi Agent · 本地运行':'ripgrep · 基础搜索',`<div class="notice">${el.dataset.tool==='pi'?'Pi 基座通过应用管理的审计扩展维护 Goal、Loop、预算和结果提交。':'默认代码查询无需语言服务器。rg 提供文本候选，调用关系需要进一步核实。'}</div><dl class="definition"><dt>环境</dt><dd>Windows x64</dd><dt>管理方式</dt><dd>应用独立目录（模拟）</dd><dt>当前状态</dt><dd>已就绪（模拟）</dd></dl>`);break;
case 'togglelsp':if(lsp){lsp=false;render();toast('Java LSP 已停用，基础搜索保持可用')}else{modal('准备 Java 语言服务器',`<p class="subtitle">以下为模拟环境准备，不下载或安装任何软件。</p><div id="installsteps" style="margin-top:20px"><div class="tool-step"><i class="dot"></i> 检查 Windows x64 运行环境</div><div class="tool-step"><i class="loading-ring"></i> 准备 Java 与 JDT-LS…</div></div>`);setTimeout(()=>{lsp=true;if(document.querySelector('#installsteps'))document.querySelector('#installsteps').innerHTML='<div class="tool-step">'+ic('check')+' Java 运行时准备完成（模拟）</div><div class="tool-step">'+ic('check')+' JDT-LS 已就绪（模拟）</div>';if(page==='tools')render();toast('Java LSP 环境准备完成（模拟）')},1300)}break;
case 'checktools':toast('模拟检查完成：Pi、rg 可用；Java LSP '+(lsp?'已就绪':'未启用'));break;
case 'exporthtml':exportReport();break;
case 'exportjson':download(current().name+'-审计结果.json',JSON.stringify(reportData(),null,2),'application/json');break;
case 'tasklog':modal('审计活动记录',`<div class="row between"><h3>Goal：调查候选 Sink 的有效污点路径</h3><span class="tag green">${task.state==='running'?'运行中':'示例记录'}</span></div><div class="task-progress"><i style="width:${task.percent}%"></i></div>${[['14:32:01','固定源码快照，加载 3 类审计模板'],['14:32:03','JDT-LS 项目索引就绪，默认 rg 可用'],['14:32:07','扫描候选 Sink：发现 6 个待分析位置'],['14:32:12','Goal SQL-001：核查 keyword 参数传播'],['14:32:16','确认 3 条调用边，保存源码证据'],['14:32:20','PATH-005：外部实现缺失，保留证据不足'],['14:32:24','提交检查点，生成图形与阶段报告']].map(([t,x])=>`<div class="guide-step"><span class="mono" style="color:#7e9cbe;min-width:62px">${t}</span><div><h3 style="font-weight:400;font-size:11px">${x}</h3></div></div>`).join('')}`);break;
case 'walkthrough':modal('从项目导入到审计报告',`${[['导入项目','支持公开 GitHub 链接和本地目录；原型可使用示例项目。'],['配置审计范围','选择漏洞模板、补充要求和 Java LSP / 基础搜索。'],['模拟运行','观察进度、暂停或停止，完成后查看 6 个示例风险点。'],['查看与复核','点击路径节点查看源码，在人工复核中保存结论与备注。'],['导出报告','生成可独立打开的 HTML 报告或结构化 JSON。']].map((x,i)=>`<div class="guide-step"><b>${i+1}</b><div><h3>${x[0]}</h3><p>${x[1]}</p></div></div>`).join('')}`,`<span></span>${btn('体验新建审计','startwalkthrough','plus','primary')}`);break;
case 'startwalkthrough':closeModal();newStep=1;draft={name:'',url:'',path:'',query:'lsp',prompt:''};newSource='github';newAudit();break;
case 'reading':modal('如何阅读风险路径',`<div class="guide-step"><b>1</b><div><h3>调用关系不等于污染传播</h3><p>A 调用了 B，还需要核实哪个实参进入哪个形参，以及数据如何进入危险参数。</p></div></div><div class="guide-step"><b>2</b><div><h3>状态表达证据的范围</h3><p>风险成立需要静态证据支持；路径已阻断只针对当前路径；未知实现和超时必须保留为证据不足。</p></div></div><div class="guide-step"><b>3</b><div><h3>人工复核保留独立结论</h3><p>复核备注和状态不覆盖机器证据，报告同时保留两者，便于团队后续验证。</p></div></div>`);break;
case 'about':modal('关于pi-audit-harness 原型',`<div class="row" style="margin-bottom:17px"><div class="project-icon">${ic('logo')}</div><div><h2>pi-audit-harness</h2><span class="subtitle">源码审计客户端 · HTML 交互原型</span></div></div><p class="subtitle" style="line-height:2.1">原型实现项目页面、三步审计向导、模拟任务、风险筛选、可点击调用图、源码与证据切换、人工复核、Markdown / Skill 模板配置、手动模型配置引导，以及 HTML / JSON 导出。<br><br>所有分析数据均为示例。无后端接口，不上传源码，不连接模型。浏览器只持久化配置元数据、模板和复核备注；不持久化 API Key。</p>`,`<button class="link-btn" data-action="reset">重置本地演示状态</button>${btn('开始体验','close','arrow','primary')}`);break;
case 'reset':['templates','reviews','model'].forEach(k=>{try{localStorage.removeItem('trace-'+k)}catch{}});location.reload();break;
}});
document.addEventListener('input',e=>{if(['tplname','tpldesc','tpllanguage','tplcategory','tplcontent'].includes(e.target.id)){captureTemplateDraft();const out=document.querySelector('#templatepreview');if(out)out.innerHTML=templatePreview()}if(e.target.id==='risksearch'){search=e.target.value;renderRiskList()}});
document.addEventListener('change',e=>{if(e.target.id==='templatefile'){readTemplateFiles(e.target.files);return}if(e.target.id==='skillfolderpicker'){readTemplateFiles(e.target.files,true);return}if(['tpllanguage','tplcategory'].includes(e.target.id)){captureTemplateDraft();document.querySelector('#templatepreview').innerHTML=templatePreview();return}if(e.target.id==='projectselect'){activeProject=e.target.value;render()}if(e.target.id==='folderpicker'&&e.target.files.length){captureDraft();const relative=e.target.files[0].webkitRelativePath;draft.path=relative.split('/')[0]+' / （'+e.target.files.length+' 个文件，仅使用目录名）';if(!draft.name)draft.name=relative.split('/')[0];newAudit()}});
document.addEventListener('submit',e=>{if(e.target.id!=='modelform')return;e.preventDefault();const m=formModel();if(!m.name||!m.url||!m.id){toast('请填写完整的模型配置',true);return}try{const u=new URL(m.url);if(!['http:','https:'].includes(u.protocol))throw Error()}catch{toast('Base URL 必须是有效的 http(s) 地址',true);return}model=m;secret=document.querySelector('#modelkey').value;store.set('model',model);toast('配置已保存；密钥仅保留在页面内存中');render()});
document.addEventListener('keydown',e=>{const n=e.target.closest('[data-node]');if(n&&(e.key==='Enter'||e.key===' ')){e.preventDefault();activeNode=+n.dataset.node;renderDetail()}});
document.querySelector('#modal').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(p!==page)go(p)});
document.querySelector('#brandicon').innerHTML=ic('logo');document.querySelector('#helpicon').innerHTML=ic('help');go(routeNames[location.hash.slice(1)]?location.hash.slice(1):'audit');
</script>
