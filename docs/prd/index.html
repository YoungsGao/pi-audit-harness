<script type="application/json" id="requirements-data">{"product": "pi-audit-harness", "date": "2026-10-16", "source": {"path": "PRD 原文快照（已内嵌于需求页面）", "lineCount": 485, "sections": [{"id": "1", "title": "背景与产品定位", "line": 7, "depth": 2, "end": 16, "text": "## 1. 背景与产品定位\n\n企业蓝队在源码审计时，需要从危险函数出发，寻找外部输入入口，逐层核对参数、返回值、字段与防护逻辑，最终整理可复核的风险证据。扫描工具能提供线索，但调用链追踪、误报排查和报告编写仍占用大量人工时间。\n\n产品通过本地语言服务器提供代码导航，由 Agent 根据污点传播规则分析调用链。客户端使用 Pi 承载 Agent，通过扩展实现 Loop & Goal 调度，以 CLI + Skill 提供代码查询和审计能力。\n\n**产品定位：面向企业蓝队、帮助审计人员发现并复核源码风险路径的桌面工具。** 首版以单人本地工作流服务企业审计场景，团队账号、集中权限和云端协作不属于首版范围。\n\n产品价值以减少人工查证和证据整理时间衡量。首版输出的是静态证据支持的风险判断，不包含动态利用验证。\n"}, {"id": "2", "title": "产品目标与用户场景", "line": 17, "depth": 2, "end": 51, "text": "## 2. 产品目标与用户场景\n\n### 2.1 产品目标\n\n1. 缩短企业蓝队从候选风险点定位到调用路径复核的时间。\n2. 自动整理外部输入、参数传播、防护逻辑和危险操作之间的源码证据。\n3. 提供列表、路径图、源码与报告联动的审计工作台。\n4. 支持用户选择审计模板、配置提示词和模型，保留人工复核入口。\n5. 通过统一查询接口和语言配置预留多语言扩展能力。\n\n首版效果通过固定样例和真实项目试用评估，记录人工复核耗时、有效风险数、证据不足数量及报告完整性。\n\n### 2.2 目标用户与使用场景\n\n| 用户 | 使用场景 | 预期结果 |\n| --- | --- | --- |\n| 企业蓝队审计人员 | 对新项目进行安全初审 | 发现候选风险点并确定优先复核路径 |\n| 企业蓝队审计人员 | 深入核查某条风险路径 | 查看输入来源、传播映射、防护判断和源码证据 |\n| 企业蓝队审计人员 | 补充业务知识或特殊审查要求 | 使用项目提示词和规则配置增强分析 |\n| 企业蓝队审计人员 | 整理审计成果 | 保存人工结论并导出带图形与证据的报告 |\n\n### 2.3 产品概览\n\n| 项目 | 首版定义 |\n| --- | --- |\n| 客户端 | Electron 桌面应用，Windows x64 |\n| 项目输入 | 公开 GitHub 仓库链接、本地源码目录 |\n| 审计范围 | Java / Spring；SQL 注入、命令注入、路径遍历 |\n| Agent | Pi 基座，自研扩展实现 Loop & Goal |\n| 代码查询 | 默认 grep/rg；可选 Java LSP，首版交付 JDT-LS 接入 |\n| 工具形式 | CLI + Skill，预留多语言 LSP 和 CodeGraph 适配 |\n| 模型配置 | 用户手动填写服务地址、API Key 和模型 ID；提供 OpenRouter 引导教程 |\n| 核心输出 | 风险列表、调用路径图、源码证据、HTML/JSON 报告 |\n| 发布方式 | 开源源码及未签名 Windows x64 安装包 |\n"}, {"id": "2.1", "title": "产品目标", "line": 19, "depth": 3, "end": 28, "text": "### 2.1 产品目标\n\n1. 缩短企业蓝队从候选风险点定位到调用路径复核的时间。\n2. 自动整理外部输入、参数传播、防护逻辑和危险操作之间的源码证据。\n3. 提供列表、路径图、源码与报告联动的审计工作台。\n4. 支持用户选择审计模板、配置提示词和模型，保留人工复核入口。\n5. 通过统一查询接口和语言配置预留多语言扩展能力。\n\n首版效果通过固定样例和真实项目试用评估，记录人工复核耗时、有效风险数、证据不足数量及报告完整性。\n"}, {"id": "2.2", "title": "目标用户与使用场景", "line": 29, "depth": 3, "end": 37, "text": "### 2.2 目标用户与使用场景\n\n| 用户 | 使用场景 | 预期结果 |\n| --- | --- | --- |\n| 企业蓝队审计人员 | 对新项目进行安全初审 | 发现候选风险点并确定优先复核路径 |\n| 企业蓝队审计人员 | 深入核查某条风险路径 | 查看输入来源、传播映射、防护判断和源码证据 |\n| 企业蓝队审计人员 | 补充业务知识或特殊审查要求 | 使用项目提示词和规则配置增强分析 |\n| 企业蓝队审计人员 | 整理审计成果 | 保存人工结论并导出带图形与证据的报告 |\n"}, {"id": "2.3", "title": "产品概览", "line": 38, "depth": 3, "end": 51, "text": "### 2.3 产品概览\n\n| 项目 | 首版定义 |\n| --- | --- |\n| 客户端 | Electron 桌面应用，Windows x64 |\n| 项目输入 | 公开 GitHub 仓库链接、本地源码目录 |\n| 审计范围 | Java / Spring；SQL 注入、命令注入、路径遍历 |\n| Agent | Pi 基座，自研扩展实现 Loop & Goal |\n| 代码查询 | 默认 grep/rg；可选 Java LSP，首版交付 JDT-LS 接入 |\n| 工具形式 | CLI + Skill，预留多语言 LSP 和 CodeGraph 适配 |\n| 模型配置 | 用户手动填写服务地址、API Key 和模型 ID；提供 OpenRouter 引导教程 |\n| 核心输出 | 风险列表、调用路径图、源码证据、HTML/JSON 报告 |\n| 发布方式 | 开源源码及未签名 Windows x64 安装包 |\n"}, {"id": "3", "title": "产品范围与需求优先级", "line": 52, "depth": 2, "end": 102, "text": "## 3. 产品范围与需求优先级\n\n### 3.1 首版交付目标\n\n用户在 Windows 安装后，可自动准备 Pi 和基础工具，配置模型，从 GitHub 或本地导入 Java/Spring 项目；选择审计能力后，系统发现候选风险点，通过 Pi 循环取证，使用 Java LSP 或基础文本查询补充调用关系，最终展示可点击源码的路径图并导出报告。\n\n首版提供企业蓝队可试用的完整工作流，覆盖项目导入、风险点发现、循环分析、证据查看、人工复核和报告导出。\n\n### 3.2 功能优先级\n\nP0 为首版交付范围，P1 为后续增强。迭代按阶段成果评估进度。\n\n| 能力 | 首版要求 | 后续增强 |\n| --- | --- | --- |\n| 安装与环境 | Windows x64 安装包；应用独立管理 Pi、rg；Java LSP 依赖按需自动准备 | 其他平台与更多架构、离线安装包、自动升级 |\n| 项目导入 | 本地目录、公开 GitHub URL，绑定源码版本或快照 | 私有仓库鉴权、增量分析 |\n| 审计配置 | 内置 SQL 注入、命令注入、路径遍历模板；可选择、编辑补充提示词并保存本地配置 | 团队模板共享、模板市场 |\n| 风险点发现 | 内置版本化 Sink 规则、规则配置文件导入、手工指定风险点 | 可视化规则编辑器、外部扫描器接入 |\n| Agent | Pi 扩展式 Goal/Loop，单任务、风险点依次处理 | 多任务并发、多 Agent 协作 |\n| 查询 | 默认 rg；Java/JDT-LS 的定义、引用与调用查询适配 | 更多语言服务器、CodeGraph |\n| 分析 | 当前支持模板下的参数、赋值、返回值和基础字段传播；检查相关防护 | 更复杂框架建模、堆对象与跨语言数据流 |\n| 可视化 | 风险列表、按路径查看的调用图、源码与证据联动 | 大图探索、图布局编辑、全仓库图 |\n| 报告 | 页面报告及 HTML 导出；同时保存结构化 JSON | Markdown、PDF、SARIF、企业报告模板 |\n| 控制与恢复 | 停止、预算上限、结果持久化、从风险点边界续跑 | 精细暂停、函数级恢复和历史版本对比 |\n| 复核 | 结论备注，未复核/确认/误报/待补充状态 | 团队审批、多人协作 |\n\n### 3.3 支持边界\n\n首版以受支持的 Java/Spring 项目及明确配置的漏洞类型为范围。复杂反射、运行时动态分派、深层跨依赖调用、跨语言传播、任意构建系统和未支持语言均应显示未覆盖项。\n\n以普通 Maven 项目和固定 Java/Spring 样例建立首版支持矩阵，发布材料记录经过验证的项目、JDK 和语言服务器版本。Gradle、多模块与特殊构建插件依据实测标注支持情况。\n\n首版不接入私有 GitHub 仓库鉴权；用户已拉取的源码可通过本地目录分析。macOS、Linux 客户端、团队协作、自动修复和动态利用验证不纳入首版范围。\n\n### 3.4 功能需求索引\n\n| 编号 | 功能需求 | 优先级 | 对应验收 |\n| --- | --- | --- | --- |\n| FR-01 | Windows x64 安装、Pi 与工具环境准备 | P0 | A01 |\n| FR-02 | 本地目录与公开 GitHub 导入、源码快照 | P0 | A02 |\n| FR-03 | 手动模型配置、OpenRouter 教程、主动连接测试 | P0 | A09 |\n| FR-04 | 三类内置漏洞模板、提示词增强与规则导入 | P0 | A06 |\n| FR-05 | 候选 Sink 扫描与手工指定风险点 | P0 | A02、A06及分析质量验收 |\n| FR-06 | 默认文本查询独立运行 | P0 | A03 |\n| FR-07 | Java LSP 语义查询与后端降级 | P0 | A04、A12 |\n| FR-08 | 多语言服务器注册与统一查询边界 | P0 | A05 |\n| FR-09 | Loop & Goal、预算控制和结构化证据 | P0 | A07 |\n| FR-10 | 风险列表、路径图、源码联动 | P0 | A08 |\n| FR-11 | 人工复核、HTML 与 JSON 报告 | P0 | A08 |\n| FR-12 | 停止、风险点级恢复及异常处理 | P0 | A10、A12 |\n"}, {"id": "3.1", "title": "首版交付目标", "line": 54, "depth": 3, "end": 59, "text": "### 3.1 首版交付目标\n\n用户在 Windows 安装后，可自动准备 Pi 和基础工具，配置模型，从 GitHub 或本地导入 Java/Spring 项目；选择审计能力后，系统发现候选风险点，通过 Pi 循环取证，使用 Java LSP 或基础文本查询补充调用关系，最终展示可点击源码的路径图并导出报告。\n\n首版提供企业蓝队可试用的完整工作流，覆盖项目导入、风险点发现、循环分析、证据查看、人工复核和报告导出。\n"}, {"id": "3.2", "title": "功能优先级", "line": 60, "depth": 3, "end": 77, "text": "### 3.2 功能优先级\n\nP0 为首版交付范围，P1 为后续增强。迭代按阶段成果评估进度。\n\n| 能力 | 首版要求 | 后续增强 |\n| --- | --- | --- |\n| 安装与环境 | Windows x64 安装包；应用独立管理 Pi、rg；Java LSP 依赖按需自动准备 | 其他平台与更多架构、离线安装包、自动升级 |\n| 项目导入 | 本地目录、公开 GitHub URL，绑定源码版本或快照 | 私有仓库鉴权、增量分析 |\n| 审计配置 | 内置 SQL 注入、命令注入、路径遍历模板；可选择、编辑补充提示词并保存本地配置 | 团队模板共享、模板市场 |\n| 风险点发现 | 内置版本化 Sink 规则、规则配置文件导入、手工指定风险点 | 可视化规则编辑器、外部扫描器接入 |\n| Agent | Pi 扩展式 Goal/Loop，单任务、风险点依次处理 | 多任务并发、多 Agent 协作 |\n| 查询 | 默认 rg；Java/JDT-LS 的定义、引用与调用查询适配 | 更多语言服务器、CodeGraph |\n| 分析 | 当前支持模板下的参数、赋值、返回值和基础字段传播；检查相关防护 | 更复杂框架建模、堆对象与跨语言数据流 |\n| 可视化 | 风险列表、按路径查看的调用图、源码与证据联动 | 大图探索、图布局编辑、全仓库图 |\n| 报告 | 页面报告及 HTML 导出；同时保存结构化 JSON | Markdown、PDF、SARIF、企业报告模板 |\n| 控制与恢复 | 停止、预算上限、结果持久化、从风险点边界续跑 | 精细暂停、函数级恢复和历史版本对比 |\n| 复核 | 结论备注，未复核/确认/误报/待补充状态 | 团队审批、多人协作 |\n"}, {"id": "3.3", "title": "支持边界", "line": 78, "depth": 3, "end": 85, "text": "### 3.3 支持边界\n\n首版以受支持的 Java/Spring 项目及明确配置的漏洞类型为范围。复杂反射、运行时动态分派、深层跨依赖调用、跨语言传播、任意构建系统和未支持语言均应显示未覆盖项。\n\n以普通 Maven 项目和固定 Java/Spring 样例建立首版支持矩阵，发布材料记录经过验证的项目、JDK 和语言服务器版本。Gradle、多模块与特殊构建插件依据实测标注支持情况。\n\n首版不接入私有 GitHub 仓库鉴权；用户已拉取的源码可通过本地目录分析。macOS、Linux 客户端、团队协作、自动修复和动态利用验证不纳入首版范围。\n"}, {"id": "3.4", "title": "功能需求索引", "line": 86, "depth": 3, "end": 102, "text": "### 3.4 功能需求索引\n\n| 编号 | 功能需求 | 优先级 | 对应验收 |\n| --- | --- | --- | --- |\n| FR-01 | Windows x64 安装、Pi 与工具环境准备 | P0 | A01 |\n| FR-02 | 本地目录与公开 GitHub 导入、源码快照 | P0 | A02 |\n| FR-03 | 手动模型配置、OpenRouter 教程、主动连接测试 | P0 | A09 |\n| FR-04 | 三类内置漏洞模板、提示词增强与规则导入 | P0 | A06 |\n| FR-05 | 候选 Sink 扫描与手工指定风险点 | P0 | A02、A06及分析质量验收 |\n| FR-06 | 默认文本查询独立运行 | P0 | A03 |\n| FR-07 | Java LSP 语义查询与后端降级 | P0 | A04、A12 |\n| FR-08 | 多语言服务器注册与统一查询边界 | P0 | A05 |\n| FR-09 | Loop & Goal、预算控制和结构化证据 | P0 | A07 |\n| FR-10 | 风险列表、路径图、源码联动 | P0 | A08 |\n| FR-11 | 人工复核、HTML 与 JSON 报告 | P0 | A08 |\n| FR-12 | 停止、风险点级恢复及异常处理 | P0 | A10、A12 |\n"}, {"id": "4", "title": "用户流程与交互", "line": 103, "depth": 2, "end": 174, "text": "## 4. 用户流程与交互\n\n### 4.1 主要使用流程\n\n1. 启动客户端，自动检查并准备 Pi、基础工具和应用自带扩展。\n2. 阅读模型配置引导，手动填写服务地址、API Key 和模型 ID，按需主动测试连接。\n3. 导入 GitHub 链接或本地源码目录，预检语言、规模和构建信息，生成任务快照。\n4. 选择审计模板，按需补充提示词，选择基础查询或 Java LSP。\n5. 查看数据发送说明并确认模型配置，开始分析。\n6. 查看风险列表、当前调查目标和活动记录，展开路径及源码证据。\n7. 标注人工复核结果，导出完整或阶段报告。\n\n用户对同一项目、模型与发送范围的确认可复用；切换到超出原授权范围的模型服务时重新确认，不要求每一轮模型调用都确认。\n\n### 4.2 首次启动与环境准备\n\n显示环境检查、下载、安装、启动和失败原因。Pi 在应用管理目录安装固定版本，加载应用提供的扩展与 Skills，不覆盖用户已有 Pi 环境。\n\n基础模式不依赖 Java LSP。用户选择 LSP 后，再检查 JDT-LS 及其所需 Java 运行时，展示具体下载和索引状态；运行时版本依据锁定的语言服务器验证。\n\n自动准备失败可重试或切换基础查询。产品不得要求用户先手工执行一套未在界面说明的终端操作才能完成标准路径。\n\n### 4.3 项目导入\n\n**本地目录：** 选择目录，展示支持语言、忽略目录、文件规模、可识别构建文件。固定源码快照，包括未提交修改；记录快照标识和文件内容摘要。\n\n**GitHub：** 输入链接，解析仓库和分支/提交，下载到应用管理目录并固定 commit。优先复用可用 Git 环境；缺失时通过环境准备流程处理并显示状态。安装验收覆盖无预装 Git 的标准导入路径。\n\n目录无权限、仓库不存在、网络失败和语言不支持分别显示原因。混合语言仓库明确列出本次分析范围与跳过部分。\n\n### 4.4 审计配置\n\n用户可选择漏洞模板，编辑“补充审查要求”，例如重点检查某种编码方式、业务封装或输入来源。高级配置支持导入自定义 Source/Sink/防护规则，以及手工指定待分析风险点。\n\n首版不做完整规则编辑器，配置文件需要模式校验、错误定位和示例。只有提示词、没有可识别 Sink 或手工风险点时，界面显示“分析增强配置”，不声称已具备该漏洞的自动发现能力。\n\n### 4.5 工作台\n\n| 区域 | 主要内容与操作 |\n| --- | --- |\n| 顶部 | 源码版本、当前阶段、模型、查询后端、用量、停止/续跑 |\n| 风险列表 | 类型、位置、严重程度、分析状态、人工复核状态；筛选和排序 |\n| 路径图 | Source、函数、Sink、防护节点，选择不同路径，点击节点和边查看证据 |\n| 源码面板 | 文件、行号、函数体、调用位置、参数映射及证据摘要 |\n| 活动区 | 当前 Goal、查询摘要、分析进度、错误及预算事件 |\n\n首版每次重点展示一条路径及必要分支，不默认绘制整个仓库调用图。图形为必交输出，但拖拽编辑、大图自动布局和自由画布不进入首版验收。\n\n进度显示已发现、待分析、分析中、已结束的数量和当前阶段。候选集变化时不展示不准确的全局百分比。\n\n### 4.6 风险状态与复核\n\n| 机器路径状态 | 含义 |\n| --- | --- |\n| 待分析 / 分析中 | 尚未形成路径结论 |\n| 风险成立（静态证据支持） | 在声明范围和假设下，外部可控数据可到达危险参数，未发现有效阻断 |\n| 路径已阻断 | 当前路径有明确的不传播或有效防护证据 |\n| 证据不足 | 关键调用关系、源码、依赖或路径条件未解决 |\n| 无效调用链 | 有证据表明某条调用关系不成立 |\n\n风险点与路径分别保存状态：一条路径成立即存在风险；尚有未知或未完成路径时，不能汇总为安全。全部已分析路径被阻断时，显示“当前已分析路径未发现有效风险”，同时显示覆盖限制。\n\n严重程度与证据充分程度分开表达，不展示未经校准的百分比置信度。人工复核保留独立状态与备注，不覆盖机器结论。\n\n### 4.7 报告\n\n报告包含项目版本、审计范围、模板/规则/Skill/Pi/模型版本、实际使用后端、任务结束原因、发现汇总、路径图、源码证据、防护分析、未解决问题、人工复核及修复建议。\n\n首版使用同一报告数据生成页面和 HTML，HTML 内嵌必要图形及样式，导出后无需运行客户端也可查看；同时保留 JSON。停止或预算耗尽时可导出阶段报告，明确标识结果不完整。\n\n报告中的源码位置绑定快照。源码、模型文本和用户备注均转义，导出文件不包含 API Key。\n"}, {"id": "4.1", "title": "主要使用流程", "line": 105, "depth": 3, "end": 116, "text": "### 4.1 主要使用流程\n\n1. 启动客户端，自动检查并准备 Pi、基础工具和应用自带扩展。\n2. 阅读模型配置引导，手动填写服务地址、API Key 和模型 ID，按需主动测试连接。\n3. 导入 GitHub 链接或本地源码目录，预检语言、规模和构建信息，生成任务快照。\n4. 选择审计模板，按需补充提示词，选择基础查询或 Java LSP。\n5. 查看数据发送说明并确认模型配置，开始分析。\n6. 查看风险列表、当前调查目标和活动记录，展开路径及源码证据。\n7. 标注人工复核结果，导出完整或阶段报告。\n\n用户对同一项目、模型与发送范围的确认可复用；切换到超出原授权范围的模型服务时重新确认，不要求每一轮模型调用都确认。\n"}, {"id": "4.2", "title": "首次启动与环境准备", "line": 117, "depth": 3, "end": 124, "text": "### 4.2 首次启动与环境准备\n\n显示环境检查、下载、安装、启动和失败原因。Pi 在应用管理目录安装固定版本，加载应用提供的扩展与 Skills，不覆盖用户已有 Pi 环境。\n\n基础模式不依赖 Java LSP。用户选择 LSP 后，再检查 JDT-LS 及其所需 Java 运行时，展示具体下载和索引状态；运行时版本依据锁定的语言服务器验证。\n\n自动准备失败可重试或切换基础查询。产品不得要求用户先手工执行一套未在界面说明的终端操作才能完成标准路径。\n"}, {"id": "4.3", "title": "项目导入", "line": 125, "depth": 3, "end": 132, "text": "### 4.3 项目导入\n\n**本地目录：** 选择目录，展示支持语言、忽略目录、文件规模、可识别构建文件。固定源码快照，包括未提交修改；记录快照标识和文件内容摘要。\n\n**GitHub：** 输入链接，解析仓库和分支/提交，下载到应用管理目录并固定 commit。优先复用可用 Git 环境；缺失时通过环境准备流程处理并显示状态。安装验收覆盖无预装 Git 的标准导入路径。\n\n目录无权限、仓库不存在、网络失败和语言不支持分别显示原因。混合语言仓库明确列出本次分析范围与跳过部分。\n"}, {"id": "4.4", "title": "审计配置", "line": 133, "depth": 3, "end": 138, "text": "### 4.4 审计配置\n\n用户可选择漏洞模板，编辑“补充审查要求”，例如重点检查某种编码方式、业务封装或输入来源。高级配置支持导入自定义 Source/Sink/防护规则，以及手工指定待分析风险点。\n\n首版不做完整规则编辑器，配置文件需要模式校验、错误定位和示例。只有提示词、没有可识别 Sink 或手工风险点时，界面显示“分析增强配置”，不声称已具备该漏洞的自动发现能力。\n"}, {"id": "4.5", "title": "工作台", "line": 139, "depth": 3, "end": 152, "text": "### 4.5 工作台\n\n| 区域 | 主要内容与操作 |\n| --- | --- |\n| 顶部 | 源码版本、当前阶段、模型、查询后端、用量、停止/续跑 |\n| 风险列表 | 类型、位置、严重程度、分析状态、人工复核状态；筛选和排序 |\n| 路径图 | Source、函数、Sink、防护节点，选择不同路径，点击节点和边查看证据 |\n| 源码面板 | 文件、行号、函数体、调用位置、参数映射及证据摘要 |\n| 活动区 | 当前 Goal、查询摘要、分析进度、错误及预算事件 |\n\n首版每次重点展示一条路径及必要分支，不默认绘制整个仓库调用图。图形为必交输出，但拖拽编辑、大图自动布局和自由画布不进入首版验收。\n\n进度显示已发现、待分析、分析中、已结束的数量和当前阶段。候选集变化时不展示不准确的全局百分比。\n"}, {"id": "4.6", "title": "风险状态与复核", "line": 153, "depth": 3, "end": 166, "text": "### 4.6 风险状态与复核\n\n| 机器路径状态 | 含义 |\n| --- | --- |\n| 待分析 / 分析中 | 尚未形成路径结论 |\n| 风险成立（静态证据支持） | 在声明范围和假设下，外部可控数据可到达危险参数，未发现有效阻断 |\n| 路径已阻断 | 当前路径有明确的不传播或有效防护证据 |\n| 证据不足 | 关键调用关系、源码、依赖或路径条件未解决 |\n| 无效调用链 | 有证据表明某条调用关系不成立 |\n\n风险点与路径分别保存状态：一条路径成立即存在风险；尚有未知或未完成路径时，不能汇总为安全。全部已分析路径被阻断时，显示“当前已分析路径未发现有效风险”，同时显示覆盖限制。\n\n严重程度与证据充分程度分开表达，不展示未经校准的百分比置信度。人工复核保留独立状态与备注，不覆盖机器结论。\n"}, {"id": "4.7", "title": "报告", "line": 167, "depth": 3, "end": 174, "text": "### 4.7 报告\n\n报告包含项目版本、审计范围、模板/规则/Skill/Pi/模型版本、实际使用后端、任务结束原因、发现汇总、路径图、源码证据、防护分析、未解决问题、人工复核及修复建议。\n\n首版使用同一报告数据生成页面和 HTML，HTML 内嵌必要图形及样式，导出后无需运行客户端也可查看；同时保留 JSON。停止或预算耗尽时可导出阶段报告，明确标识结果不完整。\n\n报告中的源码位置绑定快照。源码、模型文本和用户备注均转义，导出文件不包含 API Key。\n"}, {"id": "5", "title": "漏洞审计能力的配置设计", "line": 175, "depth": 2, "end": 195, "text": "## 5. 漏洞审计能力的配置设计\n\n### 5.1 配置层次\n\n| 层次 | 作用 | 首版实现 |\n| --- | --- | --- |\n| 通用审计规则 | 要求可追溯证据、未知处理、结构化结果 | 应用自带并版本化 |\n| 语言/框架配置 | 识别入口、符号、参数绑定与框架约定 | Java/Spring 配置；预留其他语言包 |\n| 漏洞模板 | Source、Sink、相关参数、防护语义、分析指令、报告字段 | 内置少量模板，支持文件导入 |\n| 项目补充提示词 | 补充业务封装、审计重点和特殊判断要求 | 文本编辑、保存为本地配置 |\n\n提示词可以增强分析，发现范围还受规则和查询能力限制。鉴权缺失、业务逻辑漏洞等不能一律建模成 Source 到 Sink 的污点路径；后续可提供其他 Goal 类型，首版不据此宣称覆盖所有常见 Web 漏洞。\n\n### 5.2 模板数据\n\n模板字段包括：模板 ID、版本、名称、支持语言/框架、Source 规则、Sink 规则及危险参数位置、防护说明、审计提示词、输出要求和测试样例。\n\n用户自定义模板保存为本地版本化文件，任务记录使用的具体版本。模板只提供声明式配置和提示词，不作为可执行 Pi 扩展加载；模板内的文字不能修改工具权限或结果模式。\n\n首版内置 SQL 注入、命令注入、路径遍历三个模板及对应正反例。新模板未经样本验证时标记“自定义/未验证”，与内置已验证能力区分。\n"}, {"id": "5.1", "title": "配置层次", "line": 177, "depth": 3, "end": 187, "text": "### 5.1 配置层次\n\n| 层次 | 作用 | 首版实现 |\n| --- | --- | --- |\n| 通用审计规则 | 要求可追溯证据、未知处理、结构化结果 | 应用自带并版本化 |\n| 语言/框架配置 | 识别入口、符号、参数绑定与框架约定 | Java/Spring 配置；预留其他语言包 |\n| 漏洞模板 | Source、Sink、相关参数、防护语义、分析指令、报告字段 | 内置少量模板，支持文件导入 |\n| 项目补充提示词 | 补充业务封装、审计重点和特殊判断要求 | 文本编辑、保存为本地配置 |\n\n提示词可以增强分析，发现范围还受规则和查询能力限制。鉴权缺失、业务逻辑漏洞等不能一律建模成 Source 到 Sink 的污点路径；后续可提供其他 Goal 类型，首版不据此宣称覆盖所有常见 Web 漏洞。\n"}, {"id": "5.2", "title": "模板数据", "line": 188, "depth": 3, "end": 195, "text": "### 5.2 模板数据\n\n模板字段包括：模板 ID、版本、名称、支持语言/框架、Source 规则、Sink 规则及危险参数位置、防护说明、审计提示词、输出要求和测试样例。\n\n用户自定义模板保存为本地版本化文件，任务记录使用的具体版本。模板只提供声明式配置和提示词，不作为可执行 Pi 扩展加载；模板内的文字不能修改工具权限或结果模式。\n\n首版内置 SQL 注入、命令注入、路径遍历三个模板及对应正反例。新模板未经样本验证时标记“自定义/未验证”，与内置已验证能力区分。\n"}, {"id": "6", "title": "技术选型与组件职责", "line": 196, "depth": 2, "end": 243, "text": "## 6. 技术选型与组件职责\n\n以下为首版技术方案，具体依赖版本在工程验证阶段锁定并记录。\n\n| 模块 | 技术方案 | 职责 |\n| --- | --- | --- |\n| 桌面 | Electron + TypeScript | 窗口、受控 IPC、Windows 安装包；平台相关逻辑集中封装，便于后续适配 |\n| 界面 | React + Vite | 配置、任务和风险工作台 |\n| 图形 | React Flow 类库 | 按路径绘图；首版控制图规模 |\n| 源码 | 只读源码查看组件 | 优先轻量组件，Monaco 不是首版必需依赖 |\n| Agent | 固定版本 Pi，优先 RPC 接入 | 界面通过适配层管理进程及事件 |\n| 调度 | 自研 Pi 扩展 | Goal、循环继续条件、预算、结构化结果提交 |\n| 查询 | 统一 CLI；内置 rg + Java LSP 适配 | Skill 描述如何使用，CLI 实际执行查询 |\n| 状态 | SQLite + 源码快照/产物目录 | 任务、工作项、证据、结果和风险点边界恢复 |\n| 报告 | 结构化数据 + 共用 HTML 模板 | 页面、HTML 和 JSON 保持一致 |\n| 打包 | 成熟 Electron 打包工具，早期验证 | 按 Windows x64 准备运行时和二进制；首版不接入签名流程 |\n\nPi 官方提供可扩展机制及 RPC/SDK 接入方式，本产品通过扩展实现审计工作流；具体事件和接口以锁定版本验证。参考：[Pi 仓库](https://github.com/earendil-works/pi)、[扩展文档](https://github.com/earendil-works/pi/blob/main/packages/coding-agent/docs/extensions.md)、[RPC 文档](https://github.com/earendil-works/pi/blob/main/packages/coding-agent/docs/rpc.md)。\n\n首版仅交付 Windows x64，平台相关能力集中封装。其他平台适配独立迭代，详情参考[安装包分发文档](https://www.electronjs.org/docs/latest/tutorial/application-distribution)。\n\n### 6.1 组件关系\n\n```text\nElectron 工作台\n    │ 受控 IPC\n本地应用服务\n    ├─ 环境准备 / 源码导入与快照 / 数据与报告\n    └─ Pi 进程适配层\n         └─ 审计扩展：Goal & Loop\n              ├─ 审计模板与 Skills\n              ├─ 状态与证据存储接口\n              └─ 受控 CLI\n                   ├─ 默认 rg / 源码读取\n                   ├─ LSP 查询 → 按语言选择服务器\n                   └─ CodeGraph 接口预留\n```\n\n调度的业务规则由审计扩展维护；应用服务负责生命周期、状态存储接口和事件分发，避免界面和扩展各自维护一套不同的任务状态。\n\n### 6.2 CLI 与 Skill 契约\n\n统一 CLI 提供能力查询、文本搜索、读取、符号定位、定义、引用、调用者和被调用者查询。各后端可只支持部分能力；返回值必须区分成功无命中、结果不完整、索引未就绪、超时和不支持。\n\n返回数据包含任务/快照 ID、语言、后端、文件位置、完整符号标识、调用位置、证据来源、截断标记及错误。文本同名匹配只产生候选关系，后续需结合源码或语义查询核实。\n\nSkill 按通用审计、漏洞模板、查询后端组织，按需加载；执行逻辑、凭据和预算控制不依赖提示词实现。\n"}, {"id": "6.1", "title": "组件关系", "line": 217, "depth": 3, "end": 235, "text": "### 6.1 组件关系\n\n```text\nElectron 工作台\n    │ 受控 IPC\n本地应用服务\n    ├─ 环境准备 / 源码导入与快照 / 数据与报告\n    └─ Pi 进程适配层\n         └─ 审计扩展：Goal & Loop\n              ├─ 审计模板与 Skills\n              ├─ 状态与证据存储接口\n              └─ 受控 CLI\n                   ├─ 默认 rg / 源码读取\n                   ├─ LSP 查询 → 按语言选择服务器\n                   └─ CodeGraph 接口预留\n```\n\n调度的业务规则由审计扩展维护；应用服务负责生命周期、状态存储接口和事件分发，避免界面和扩展各自维护一套不同的任务状态。\n"}, {"id": "6.2", "title": "CLI 与 Skill 契约", "line": 236, "depth": 3, "end": 243, "text": "### 6.2 CLI 与 Skill 契约\n\n统一 CLI 提供能力查询、文本搜索、读取、符号定位、定义、引用、调用者和被调用者查询。各后端可只支持部分能力；返回值必须区分成功无命中、结果不完整、索引未就绪、超时和不支持。\n\n返回数据包含任务/快照 ID、语言、后端、文件位置、完整符号标识、调用位置、证据来源、截断标记及错误。文本同名匹配只产生候选关系，后续需结合源码或语义查询核实。\n\nSkill 按通用审计、漏洞模板、查询后端组织，按需加载；执行逻辑、凭据和预算控制不依赖提示词实现。\n"}, {"id": "7", "title": "多语言 LSP 架构与 Java 首次接入", "line": 244, "depth": 2, "end": 273, "text": "## 7. 多语言 LSP 架构与 Java 首次接入\n\n### 7.1 多语言设计要求\n\n语言扩展包同时描述文件识别、框架规则、入口/Sink 模式及查询适配。LSP 本身只提供代码导航等语义能力，不被当作污点分析引擎。\n\n| 模块 | 职责 |\n| --- | --- |\n| 语言配置注册表 | languageId、扩展名、项目根识别、运行时要求、服务器版本与启动参数 |\n| 服务器管理器 | 按项目根、语言和配置启动/复用服务器，处理启动、索引、超时与退出 |\n| 能力协商 | 根据服务器实际能力选择定义、引用、实现、调用层次等请求 |\n| 位置适配 | 处理文件 URI、范围和位置编码，转换到统一源码引用格式 |\n| 结果适配 | 将不同服务器返回值转为统一符号、调用边及查询状态 |\n| 语言规则包 | 将语言/框架语义用于 Source、Sink、传播和防护分析 |\n\n同一仓库可包含多个语言和项目根；设计不使用“每个应用只有一个全局语言服务器”的假设。首版只实现 Java 配置及 JDT-LS 适配，其他语言显示不支持，不自动下载所有服务器。\n\n跨语言调用关系不因注册了多个服务器就视为已解决；后续需要专门的桥接规则。\n\n### 7.2 Java LSP 首版要求\n\n1. 自动检测或准备语言服务器运行环境，启动固定版本 JDT-LS。\n2. 识别受支持项目根，显示启动、导入、索引及错误信息。\n3. 查询定义和引用，结合函数范围识别调用位置；调用层次请求在能力可用时使用。\n4. 在至少一个跨文件 Java 样例上获得真实语义查询结果，并参与最终风险路径分析。\n5. 索引不完整或查询失败时记录覆盖缺口，可降级为文本搜索；不直接作安全结论。\n6. 常驻服务由 CLI 背后的本地管理进程复用，避免每次命令重新启动和索引。\n\n实现时不以一次诊断通知作为整个工作区索引完成的证明，也不承诺 LSP 能完全解析动态分派和反射。参考：[LSP 规范](https://microsoft.github.io/language-server-protocol/specifications/lsp/3.17/specification/)、[JDT-LS 仓库](https://github.com/eclipse-jdtls/eclipse.jdt.ls)。\n"}, {"id": "7.1", "title": "多语言设计要求", "line": 246, "depth": 3, "end": 262, "text": "### 7.1 多语言设计要求\n\n语言扩展包同时描述文件识别、框架规则、入口/Sink 模式及查询适配。LSP 本身只提供代码导航等语义能力，不被当作污点分析引擎。\n\n| 模块 | 职责 |\n| --- | --- |\n| 语言配置注册表 | languageId、扩展名、项目根识别、运行时要求、服务器版本与启动参数 |\n| 服务器管理器 | 按项目根、语言和配置启动/复用服务器，处理启动、索引、超时与退出 |\n| 能力协商 | 根据服务器实际能力选择定义、引用、实现、调用层次等请求 |\n| 位置适配 | 处理文件 URI、范围和位置编码，转换到统一源码引用格式 |\n| 结果适配 | 将不同服务器返回值转为统一符号、调用边及查询状态 |\n| 语言规则包 | 将语言/框架语义用于 Source、Sink、传播和防护分析 |\n\n同一仓库可包含多个语言和项目根；设计不使用“每个应用只有一个全局语言服务器”的假设。首版只实现 Java 配置及 JDT-LS 适配，其他语言显示不支持，不自动下载所有服务器。\n\n跨语言调用关系不因注册了多个服务器就视为已解决；后续需要专门的桥接规则。\n"}, {"id": "7.2", "title": "Java LSP 首版要求", "line": 263, "depth": 3, "end": 273, "text": "### 7.2 Java LSP 首版要求\n\n1. 自动检测或准备语言服务器运行环境，启动固定版本 JDT-LS。\n2. 识别受支持项目根，显示启动、导入、索引及错误信息。\n3. 查询定义和引用，结合函数范围识别调用位置；调用层次请求在能力可用时使用。\n4. 在至少一个跨文件 Java 样例上获得真实语义查询结果，并参与最终风险路径分析。\n5. 索引不完整或查询失败时记录覆盖缺口，可降级为文本搜索；不直接作安全结论。\n6. 常驻服务由 CLI 背后的本地管理进程复用，避免每次命令重新启动和索引。\n\n实现时不以一次诊断通知作为整个工作区索引完成的证明，也不承诺 LSP 能完全解析动态分派和反射。参考：[LSP 规范](https://microsoft.github.io/language-server-protocol/specifications/lsp/3.17/specification/)、[JDT-LS 仓库](https://github.com/eclipse-jdtls/eclipse.jdt.ls)。\n"}, {"id": "8", "title": "Loop & Goal 工作机制", "line": 274, "depth": 2, "end": 299, "text": "## 8. Loop & Goal 工作机制\n\n### 8.1 目标与循环\n\n项目 Goal 固定源码范围、漏洞模板、预算与结束条件。每个候选 Sink 生成调查工作项，按需增加查找入口、确认调用目标、核实防护等子项。首版单任务串行处理，不要求多 Agent。\n\n单轮流程：领取工作项 → 加载相关证据摘要 → 按需查询源码/LSP → 分析当前传播或防护问题 → 提交结构化证据与状态 → 校验并持久化 → 判断继续或结束。\n\n调用关系和污点传播分别保存。污染状态不能只有参数布尔数组，至少记录来源、参数/变量/字段位置、传播类型、目标位置、路径条件及防护证据。遇到缺失源码或调用歧义时允许证据不足。\n\n### 8.2 首版结束条件\n\n- 所有已派发工作项已形成结论或明确未解决原因。\n- 用户停止；保留已提交结果，允许生成阶段报告。\n- 到达时间、模型请求数、Token、深度或分支预算；停止继续扩展并列出剩余项。\n- 同一问题重复查询且没有新增证据，结束当前分支为证据不足。\n- 模型/工具短暂错误有限重试；持续错误保存任务，等待用户处理。\n\n单次会话结束不自动等于项目 Goal 完成。继续条件和预算由扩展代码检查；模型输出“已完成”仍须通过工作项与证据校验。\n\n### 8.3 持久化与恢复\n\n首版在风险点完成或明确中断时提交检查点。崩溃后保留已完成风险点，重跑当时尚未提交的风险点；界面说明恢复粒度及可能重复产生的模型用量。\n\n新源码或更换审计配置创建新任务，恢复任务使用原快照和配置。精细到函数或单次模型响应的无损恢复作为后续增强。\n"}, {"id": "8.1", "title": "目标与循环", "line": 276, "depth": 3, "end": 283, "text": "### 8.1 目标与循环\n\n项目 Goal 固定源码范围、漏洞模板、预算与结束条件。每个候选 Sink 生成调查工作项，按需增加查找入口、确认调用目标、核实防护等子项。首版单任务串行处理，不要求多 Agent。\n\n单轮流程：领取工作项 → 加载相关证据摘要 → 按需查询源码/LSP → 分析当前传播或防护问题 → 提交结构化证据与状态 → 校验并持久化 → 判断继续或结束。\n\n调用关系和污点传播分别保存。污染状态不能只有参数布尔数组，至少记录来源、参数/变量/字段位置、传播类型、目标位置、路径条件及防护证据。遇到缺失源码或调用歧义时允许证据不足。\n"}, {"id": "8.2", "title": "首版结束条件", "line": 284, "depth": 3, "end": 293, "text": "### 8.2 首版结束条件\n\n- 所有已派发工作项已形成结论或明确未解决原因。\n- 用户停止；保留已提交结果，允许生成阶段报告。\n- 到达时间、模型请求数、Token、深度或分支预算；停止继续扩展并列出剩余项。\n- 同一问题重复查询且没有新增证据，结束当前分支为证据不足。\n- 模型/工具短暂错误有限重试；持续错误保存任务，等待用户处理。\n\n单次会话结束不自动等于项目 Goal 完成。继续条件和预算由扩展代码检查；模型输出“已完成”仍须通过工作项与证据校验。\n"}, {"id": "8.3", "title": "持久化与恢复", "line": 294, "depth": 3, "end": 299, "text": "### 8.3 持久化与恢复\n\n首版在风险点完成或明确中断时提交检查点。崩溃后保留已完成风险点，重跑当时尚未提交的风险点；界面说明恢复粒度及可能重复产生的模型用量。\n\n新源码或更换审计配置创建新任务，恢复任务使用原快照和配置。精细到函数或单次模型响应的无损恢复作为后续增强。\n"}, {"id": "9", "title": "模型配置与 OpenRouter 使用引导", "line": 300, "depth": 2, "end": 334, "text": "## 9. 模型配置与 OpenRouter 使用引导\n\n### 9.1 配置原则\n\n模型由用户自行选择和配置。客户端不自动拉取模型目录，不自动发现免费模型，不自动推荐、选择或切换模型，也不为用户创建账号或提供公共 Key。\n\n设置页提供服务名称、Base URL、API Key、模型 ID，以及保存、编辑、删除和测试连接操作。用户可配置受支持的模型供应商、企业网关或本地模型接口；兼容性以经过验证的接口和工具调用能力为准。\n\n### 9.2 OpenRouter 引导教程\n\n教程可从首次配置页和设置页打开，包含以下步骤：\n\n1. 访问 OpenRouter 官网，自行注册或登录账号。\n2. 在 OpenRouter 控制台创建 API Key，并查看账号可用额度和限制。\n3. 在 OpenRouter 模型页面选择适合审计任务的模型，复制准确的模型 ID；如需免费模型，由用户在官方页面自行选择。\n4. 在客户端填写服务名称、官方文档提供的 Base URL、API Key 和模型 ID。\n5. 点击“测试连接”，确认接口及工具调用可用，保存配置。\n6. 创建审计任务时选择已保存的配置，阅读数据发送说明并开始分析。\n\n教程提供文本说明、填写示例和官方链接，不保存实际密钥。示例模型 ID 使用占位符，不预填某个实时模型。参考：[OpenRouter 快速开始](https://openrouter.ai/docs/quickstart)、[鉴权说明](https://openrouter.ai/docs/api_reference/authentication)、[免费变体说明](https://openrouter.ai/docs/guides/routing/model-variants/free)。\n\n### 9.3 连接测试与配置保存\n\n连接测试只在用户主动点击后执行，使用不含项目源码的固定样例。结果区分地址或网络错误、鉴权失败、模型不存在、额度不足、限流和工具调用不兼容，并提供处理说明。连接测试可能产生少量调用用量，按钮附近说明这一点。\n\n保存配置不触发模型调用。Key 使用系统凭据存储，界面只显示掩码；报告和普通日志不包含凭据。更换模型由用户主动编辑或选择配置，客户端不自动替换模型。\n\n### 9.4 源码发送与错误处理\n\n首次向选定服务发送项目源码前，展示服务地址、模型、发送内容类别及数据政策链接，由用户确认。同一项目、服务及发送范围的授权可复用，超出范围时重新确认。OpenRouter 各提供方的数据处理政策不同，教程提供[数据政策说明](https://openrouter.ai/docs/guides/privacy/provider-logging)。\n\n模型服务错误有限重试；遇到 429 按服务端提示和有限退避处理，额度耗尽时保存进度。用户可以修正配置或主动更换模型后继续；任务记录实际使用模型。配额与可用性参考[官方限额说明](https://openrouter.ai/docs/api_reference/limits)。\n\n分析验收固定参考模型与调用配置，记录模型实际标识及工具调用适配结果。用户自行配置的其他模型不自动继承参考模型的质量评价。\n"}, {"id": "9.1", "title": "配置原则", "line": 302, "depth": 3, "end": 307, "text": "### 9.1 配置原则\n\n模型由用户自行选择和配置。客户端不自动拉取模型目录，不自动发现免费模型，不自动推荐、选择或切换模型，也不为用户创建账号或提供公共 Key。\n\n设置页提供服务名称、Base URL、API Key、模型 ID，以及保存、编辑、删除和测试连接操作。用户可配置受支持的模型供应商、企业网关或本地模型接口；兼容性以经过验证的接口和工具调用能力为准。\n"}, {"id": "9.2", "title": "OpenRouter 引导教程", "line": 308, "depth": 3, "end": 320, "text": "### 9.2 OpenRouter 引导教程\n\n教程可从首次配置页和设置页打开，包含以下步骤：\n\n1. 访问 OpenRouter 官网，自行注册或登录账号。\n2. 在 OpenRouter 控制台创建 API Key，并查看账号可用额度和限制。\n3. 在 OpenRouter 模型页面选择适合审计任务的模型，复制准确的模型 ID；如需免费模型，由用户在官方页面自行选择。\n4. 在客户端填写服务名称、官方文档提供的 Base URL、API Key 和模型 ID。\n5. 点击“测试连接”，确认接口及工具调用可用，保存配置。\n6. 创建审计任务时选择已保存的配置，阅读数据发送说明并开始分析。\n\n教程提供文本说明、填写示例和官方链接，不保存实际密钥。示例模型 ID 使用占位符，不预填某个实时模型。参考：[OpenRouter 快速开始](https://openrouter.ai/docs/quickstart)、[鉴权说明](https://openrouter.ai/docs/api_reference/authentication)、[免费变体说明](https://openrouter.ai/docs/guides/routing/model-variants/free)。\n"}, {"id": "9.3", "title": "连接测试与配置保存", "line": 321, "depth": 3, "end": 326, "text": "### 9.3 连接测试与配置保存\n\n连接测试只在用户主动点击后执行，使用不含项目源码的固定样例。结果区分地址或网络错误、鉴权失败、模型不存在、额度不足、限流和工具调用不兼容，并提供处理说明。连接测试可能产生少量调用用量，按钮附近说明这一点。\n\n保存配置不触发模型调用。Key 使用系统凭据存储，界面只显示掩码；报告和普通日志不包含凭据。更换模型由用户主动编辑或选择配置，客户端不自动替换模型。\n"}, {"id": "9.4", "title": "源码发送与错误处理", "line": 327, "depth": 3, "end": 334, "text": "### 9.4 源码发送与错误处理\n\n首次向选定服务发送项目源码前，展示服务地址、模型、发送内容类别及数据政策链接，由用户确认。同一项目、服务及发送范围的授权可复用，超出范围时重新确认。OpenRouter 各提供方的数据处理政策不同，教程提供[数据政策说明](https://openrouter.ai/docs/guides/privacy/provider-logging)。\n\n模型服务错误有限重试；遇到 429 按服务端提示和有限退避处理，额度耗尽时保存进度。用户可以修正配置或主动更换模型后继续；任务记录实际使用模型。配额与可用性参考[官方限额说明](https://openrouter.ai/docs/api_reference/limits)。\n\n分析验收固定参考模型与调用配置，记录模型实际标识及工具调用适配结果。用户自行配置的其他模型不自动继承参考模型的质量评价。\n"}, {"id": "10", "title": "数据与非功能要求", "line": 335, "depth": 2, "end": 366, "text": "## 10. 数据与非功能要求\n\n### 10.1 核心数据\n\n| 对象 | 至少保存 |\n| --- | --- |\n| ProjectSnapshot | 项目来源、commit/快照 ID、文件摘要、忽略范围 |\n| AuditProfile | 语言/框架、模板及版本、补充提示词、模型和查询配置 |\n| ScanRun / Goal | 任务状态、工作项、预算、实际用量、结束原因、检查点 |\n| CandidateSink | 规则、危险参数、文件范围、源码版本 |\n| CallEdge / TaintEvidence | 符号、调用位置、数据映射、来源后端、确认状态、防护与未解决项 |\n| Finding / Review | 路径结论、严重程度、证据摘要、人工复核及备注 |\n| Report | 导出时结果快照、生成时间、过滤条件 |\n\n### 10.2 执行与数据边界\n\n目标仓库内的说明、注释、AGENTS.md、Skill 文件均作为分析材料，不自动加载为可信运行指令。只加载应用管理的 Pi 扩展和 Skills。\n\n分析默认不修改用户源码，不启动目标业务。基础查询限制在任务快照和受控缓存内，使用参数化进程调用。Pi 通用写入、编辑和不受限命令执行能力不直接开放给审计任务；CLI + Skill 可通过受控命令工具运行。\n\nJDT-LS 项目导入可能涉及依赖解析或构建，需验证并限制项目插件/脚本执行路径，记录网络与执行行为。仅复制源码到快照并不等于隔离目标代码执行。\n\n应用级工具限制不能宣称为操作系统级沙箱；企业上线前另行验证隔离要求。首版也须通过仓库提示词注入、越界读写和任意命令执行的指定测试。\n\nAPI Key 进入系统凭据存储，日志与报告脱敏。Electron 使用受控预加载桥接和上下文隔离，源码及模型文本按不可信数据渲染。参考：[Electron 上下文隔离](https://www.electronjs.org/docs/latest/tutorial/context-isolation)。\n\n### 10.3 性能与可观测性\n\n记录导入、索引、规则扫描、工具查询、模型调用的耗时、重试和用量。无法获知费用时显示未知或明确标注估算。\n\n首版性能验收基准为 1 万至 5 万行的受支持 Java 项目、100 个候选点、单路径图不超过 50 个节点。超限可选择目录缩小范围；大规模能力后续测量，不预设全仓库性能承诺。\n"}, {"id": "10.1", "title": "核心数据", "line": 337, "depth": 3, "end": 348, "text": "### 10.1 核心数据\n\n| 对象 | 至少保存 |\n| --- | --- |\n| ProjectSnapshot | 项目来源、commit/快照 ID、文件摘要、忽略范围 |\n| AuditProfile | 语言/框架、模板及版本、补充提示词、模型和查询配置 |\n| ScanRun / Goal | 任务状态、工作项、预算、实际用量、结束原因、检查点 |\n| CandidateSink | 规则、危险参数、文件范围、源码版本 |\n| CallEdge / TaintEvidence | 符号、调用位置、数据映射、来源后端、确认状态、防护与未解决项 |\n| Finding / Review | 路径结论、严重程度、证据摘要、人工复核及备注 |\n| Report | 导出时结果快照、生成时间、过滤条件 |\n"}, {"id": "10.2", "title": "执行与数据边界", "line": 349, "depth": 3, "end": 360, "text": "### 10.2 执行与数据边界\n\n目标仓库内的说明、注释、AGENTS.md、Skill 文件均作为分析材料，不自动加载为可信运行指令。只加载应用管理的 Pi 扩展和 Skills。\n\n分析默认不修改用户源码，不启动目标业务。基础查询限制在任务快照和受控缓存内，使用参数化进程调用。Pi 通用写入、编辑和不受限命令执行能力不直接开放给审计任务；CLI + Skill 可通过受控命令工具运行。\n\nJDT-LS 项目导入可能涉及依赖解析或构建，需验证并限制项目插件/脚本执行路径，记录网络与执行行为。仅复制源码到快照并不等于隔离目标代码执行。\n\n应用级工具限制不能宣称为操作系统级沙箱；企业上线前另行验证隔离要求。首版也须通过仓库提示词注入、越界读写和任意命令执行的指定测试。\n\nAPI Key 进入系统凭据存储，日志与报告脱敏。Electron 使用受控预加载桥接和上下文隔离，源码及模型文本按不可信数据渲染。参考：[Electron 上下文隔离](https://www.electronjs.org/docs/latest/tutorial/context-isolation)。\n"}, {"id": "10.3", "title": "性能与可观测性", "line": 361, "depth": 3, "end": 366, "text": "### 10.3 性能与可观测性\n\n记录导入、索引、规则扫描、工具查询、模型调用的耗时、重试和用量。无法获知费用时显示未知或明确标注估算。\n\n首版性能验收基准为 1 万至 5 万行的受支持 Java 项目、100 个候选点、单路径图不超过 50 个节点。超限可选择目录缩小范围；大规模能力后续测量，不预设全仓库性能承诺。\n"}, {"id": "11", "title": "开发分工与实施计划", "line": 367, "depth": 2, "end": 409, "text": "## 11. 开发分工与实施计划\n\n### 11.1 排期原则\n\n以半个月形成可试用首版为目标，参考约 10 个有效工作日安排，不将其视为刚性交付日期。开发工程师承担主要编码工作，项目负责人每天约 2–4 小时参与产品、架构、关键技术与验收；具体工作量与承担方式随进展调整。\n\n首版聚焦 Windows x64、Java LSP、Pi 扩展、可视化和报告。优先复用成熟组件，采用单任务、路径级图形、三个内置漏洞模板、HTML/JSON 报告和风险点级恢复，减少并行建设的内容。\n\n按可运行的阶段成果判断进度：先验证关键依赖，再跑通真实路径，随后完善界面与报告，最后集中处理安装和回归。遇到难点时调整任务拆分、协作方式和预计工期，不用尚未验证的功能替代真实成果。\n\n### 11.2 角色分工\n\n| 负责人 | 主要职责 | 交付与协作方式 |\n| --- | --- | --- |\n| 项目负责人（全栈工程师） | 锁定范围；Pi 扩展和 LSP 关键验证；定义证据模式、规则及正反例；关键代码评审；Windows 验收 | 每天 2–4 小时优先投入风险最高部分；关键适配提供可运行骨架或配对支持 |\n| 开发工程师（初级） | Electron/React 页面、配置表单、项目导入、任务事件展示、列表与路径图、报告模板、打包及常规测试 | 按可运行样例和明确接口拆小任务，逐日提交可演示结果 |\n| 两人共同 | CLI/状态/事件契约、集成、真实项目复核、异常测试 | 每天一次集成；关键适配由项目负责人提供可运行骨架或配对完成 |\n\n不额外假定有独立产品、测试、安全人员。样本标注与人工复核由项目负责人承担，开发工程师整理测试记录和执行回归。\n\n### 11.3 参考阶段与任务顺序\n\n以下以约 10 个有效工作日为参考，可在半个月目标窗口内交错推进。天数为估算，实际安排由两人根据进展调整。\n\n| 阶段 | 参考投入 | 开发工程师主要任务 | 项目负责人重点任务 | 阶段成果 |\n| --- | --- | --- | --- | --- |\n| 1. 工程与关键技术验证 | 约 2 天 | Electron 工程、Windows x64 打包骨架、模型设置与事件展示 | 固定 Pi 版本；跑通扩展继续/终止、模型工具调用、Java LSP 定义/引用 CLI | 安装后可启动客户端，并取得真实 Pi 会话和 Java 跨文件查询结果 |\n| 2. 真实审计闭环 | 约 2 天 | 本地/GitHub 导入、快照、候选列表与任务页面 | 定义扩展、证据与状态骨架；跑通 Source→Sink 路径 | 真实项目、真实工具查询和结构化结论连接起来 |\n| 3. 核心输出与配置 | 约 2 天 | 路径图、源码定位、HTML/JSON 报告、模板配置页 | 完善三类模板及正反例，核实防护与未知状态 | 列表、图、源码与报告一致，三类模板可选择并配置增强 |\n| 4. 安装与运行可靠性 | 约 2 天 | 环境自动准备、Windows 集成、停止/续跑与错误提示 | 验证 LSP 安装/索引失败、模型限流与执行边界 | 从安装到报告完整演练，中断和失败后可处理 |\n| 5. 回归与开源发布准备 | 约 2 天 | 修复、安装包、README、构建说明与示例产物 | 人工复核样本和真实项目，确认已知限制 | 可试用的 Windows x64 安装包、源码及验证记录 |\n\n建议开发初期验证安装与 LSP，避免最后集中处理环境问题；模型设置、列表和报告框架可与关键适配工作交错推进。阶段完成后再更新剩余工作量，保留必要的修复时间。\n\n### 11.4 进度检查与协作\n\n- 技术验证阶段检查 Pi 扩展、Java LSP 和 Windows 安装是否跑通；有阻碍时尽早共同解决。\n- 真实审计闭环完成后再扩展样本和交互，避免界面已齐全但分析链路尚未成立。\n- 核心输出完成后逐步收敛新增需求，将精力转向安装、故障处理和回归。\n- 任务分工可协商。项目负责人优先处理影响整体进度的接口、架构和关键适配，开发工程师按小任务完成编码并持续集成。\n- 聊天、多任务并发、复杂规则编辑、复杂图探索和更多导出格式留到后续；Java LSP、Windows x64 安装包、路径图及报告保留为首版核心。\n- 阶段工期变化及时更新计划；若涉及核心范围调整，再共同确认。\n"}, {"id": "11.1", "title": "排期原则", "line": 369, "depth": 3, "end": 376, "text": "### 11.1 排期原则\n\n以半个月形成可试用首版为目标，参考约 10 个有效工作日安排，不将其视为刚性交付日期。开发工程师承担主要编码工作，项目负责人每天约 2–4 小时参与产品、架构、关键技术与验收；具体工作量与承担方式随进展调整。\n\n首版聚焦 Windows x64、Java LSP、Pi 扩展、可视化和报告。优先复用成熟组件，采用单任务、路径级图形、三个内置漏洞模板、HTML/JSON 报告和风险点级恢复，减少并行建设的内容。\n\n按可运行的阶段成果判断进度：先验证关键依赖，再跑通真实路径，随后完善界面与报告，最后集中处理安装和回归。遇到难点时调整任务拆分、协作方式和预计工期，不用尚未验证的功能替代真实成果。\n"}, {"id": "11.2", "title": "角色分工", "line": 377, "depth": 3, "end": 386, "text": "### 11.2 角色分工\n\n| 负责人 | 主要职责 | 交付与协作方式 |\n| --- | --- | --- |\n| 项目负责人（全栈工程师） | 锁定范围；Pi 扩展和 LSP 关键验证；定义证据模式、规则及正反例；关键代码评审；Windows 验收 | 每天 2–4 小时优先投入风险最高部分；关键适配提供可运行骨架或配对支持 |\n| 开发工程师（初级） | Electron/React 页面、配置表单、项目导入、任务事件展示、列表与路径图、报告模板、打包及常规测试 | 按可运行样例和明确接口拆小任务，逐日提交可演示结果 |\n| 两人共同 | CLI/状态/事件契约、集成、真实项目复核、异常测试 | 每天一次集成；关键适配由项目负责人提供可运行骨架或配对完成 |\n\n不额外假定有独立产品、测试、安全人员。样本标注与人工复核由项目负责人承担，开发工程师整理测试记录和执行回归。\n"}, {"id": "11.3", "title": "参考阶段与任务顺序", "line": 387, "depth": 3, "end": 400, "text": "### 11.3 参考阶段与任务顺序\n\n以下以约 10 个有效工作日为参考，可在半个月目标窗口内交错推进。天数为估算，实际安排由两人根据进展调整。\n\n| 阶段 | 参考投入 | 开发工程师主要任务 | 项目负责人重点任务 | 阶段成果 |\n| --- | --- | --- | --- | --- |\n| 1. 工程与关键技术验证 | 约 2 天 | Electron 工程、Windows x64 打包骨架、模型设置与事件展示 | 固定 Pi 版本；跑通扩展继续/终止、模型工具调用、Java LSP 定义/引用 CLI | 安装后可启动客户端，并取得真实 Pi 会话和 Java 跨文件查询结果 |\n| 2. 真实审计闭环 | 约 2 天 | 本地/GitHub 导入、快照、候选列表与任务页面 | 定义扩展、证据与状态骨架；跑通 Source→Sink 路径 | 真实项目、真实工具查询和结构化结论连接起来 |\n| 3. 核心输出与配置 | 约 2 天 | 路径图、源码定位、HTML/JSON 报告、模板配置页 | 完善三类模板及正反例，核实防护与未知状态 | 列表、图、源码与报告一致，三类模板可选择并配置增强 |\n| 4. 安装与运行可靠性 | 约 2 天 | 环境自动准备、Windows 集成、停止/续跑与错误提示 | 验证 LSP 安装/索引失败、模型限流与执行边界 | 从安装到报告完整演练，中断和失败后可处理 |\n| 5. 回归与开源发布准备 | 约 2 天 | 修复、安装包、README、构建说明与示例产物 | 人工复核样本和真实项目，确认已知限制 | 可试用的 Windows x64 安装包、源码及验证记录 |\n\n建议开发初期验证安装与 LSP，避免最后集中处理环境问题；模型设置、列表和报告框架可与关键适配工作交错推进。阶段完成后再更新剩余工作量，保留必要的修复时间。\n"}, {"id": "11.4", "title": "进度检查与协作", "line": 401, "depth": 3, "end": 409, "text": "### 11.4 进度检查与协作\n\n- 技术验证阶段检查 Pi 扩展、Java LSP 和 Windows 安装是否跑通；有阻碍时尽早共同解决。\n- 真实审计闭环完成后再扩展样本和交互，避免界面已齐全但分析链路尚未成立。\n- 核心输出完成后逐步收敛新增需求，将精力转向安装、故障处理和回归。\n- 任务分工可协商。项目负责人优先处理影响整体进度的接口、架构和关键适配，开发工程师按小任务完成编码并持续集成。\n- 聊天、多任务并发、复杂规则编辑、复杂图探索和更多导出格式留到后续；Java LSP、Windows x64 安装包、路径图及报告保留为首版核心。\n- 阶段工期变化及时更新计划；若涉及核心范围调整，再共同确认。\n"}, {"id": "12", "title": "测试与验收", "line": 410, "depth": 2, "end": 458, "text": "## 12. 测试与验收\n\n### 12.1 验收环境与样本\n\n至少一台 Windows x64 的真实或受支持虚拟测试环境，记录系统、CPU、内存、Pi/JDT-LS/Java 版本及网络条件。仅在开发机器启动或仅产出安装文件不算 Windows 安装验收。\n\n建立不少于 18 个小型安全样例：三个内置模板各至少 2 个风险成立、2 个有效阻断样例，另补 6 个调用歧义、缺依赖、循环或防护不明的样例。配合一个可固定版本的真实 Java/Spring 项目，验证完整流程。\n\n开发与验收样例分离，样例结论由项目负责人标注。先在固定参考模型上评测，再由测试人员手动配置一个可用免费模型进行兼容性验证；记录模型、模板、规则、源码和查询后端版本。首版样本较小，只形成试用基线，不据此宣称普遍准确率。\n\n### 12.2 必交功能验收\n\n| 编号 | 场景 | 通过条件 |\n| --- | --- | --- |\n| A01 | Windows x64 新环境安装 | 安装包可启动；按设计自动准备 Pi 和查询工具，标准流程不要求手工修改代码 |\n| A02 | 两种项目输入 | 本地及公开 GitHub 均完成分析，记录快照或 commit，报告位置一致 |\n| A03 | 默认查询独立运行 | 未安装 LSP 时仍可完成候选发现、分析、图形和报告 |\n| A04 | Java LSP 真实接入 | 在受支持项目中完成定义/引用和跨文件调用定位，并参与至少一条最终风险路径 |\n| A05 | 多语言架构 | 存在语言配置/服务器管理/统一查询边界；业务流程无硬编码的全局 Java 单服务器假设 |\n| A06 | 自定义审计配置 | 能选择模板、编辑并保存提示词；配置进入真实分析；规则导入错误可定位 |\n| A07 | Loop & Goal | 多轮取证至结论；目标、进度可观察；停止、预算和无进展限制实际生效 |\n| A08 | 图与报告 | 列表、图、源码及报告联动；HTML 离线可查看图形与证据；JSON 与界面结论一致 |\n| A09 | 手动模型配置与教程 | 用户可按教程完成配置；保存不触发调用；仅主动测试连接；不自动拉取模型列表或切换模型；确认前不发送源码 |\n| A10 | 中断和恢复 | 风险点边界结果保留，重启后可继续；未提交风险点明确重跑，已提交结果不重复计数 |\n| A11 | 执行与数据边界 | 指定注入和越界用例不执行目标仓库指令、不修改源码、不泄露凭据 |\n| A12 | 故障与降级 | LSP 启动/索引失败、模型错误、断网均有原因和下一步；缺关键证据时保持待定 |\n\n### 12.3 分析质量验收\n\n分开测量候选 Sink 发现、调用边正确性、污点判定和证据定位，不以“任务完成”替代质量检查。\n\n首版质量基线：验收样例中声明支持的 Sink 全部命中；简单正反例得到预期结论；关键依赖缺失、超时和调用歧义不错误判为安全；所有输出引用均可定位；真实项目至少展示一条经人工复核的风险或阻断路径。\n\n上述基线用于首版支持范围内的小规模验证。每个样例运行三次，记录通过数、未知数和失败原因，作为验收附件；未达到基线的用例应修复或明确列入未支持范围。普遍准确率需在扩大样本集后独立评估。\n\n### 12.4 性能和稳定性\n\n- 参考仓库和机器在技术验证后固定；模型耗时、LSP 索引耗时与本地 UI 响应分别记录。\n- 100 个候选条目和 50 节点当前路径图可用，长时间查询不阻塞界面。\n- 停止请求 2 秒内得到界面确认，5 秒内停止派发新工作；外部请求取消失败时明确显示等待状态。\n- 完成一次至少 1 小时连续运行和一次进程中断恢复测试，无未受控循环和已提交结果丢失。\n- 外部模型可用性和额度不作为产品可控制的扫描时长承诺；固定参考样例记录耗时、请求数与 Token。\n\n### 12.5 首版交付物\n\nWindows x64 安装包、源码与锁定依赖、内置模板和 Skills、测试/兼容矩阵、样例项目或可获取说明、示例图形与 HTML/JSON 报告、用户操作说明和已知限制。\n\n首版按开源项目发布，提供未签名的 Windows x64 安装包。发布材料包含 README、构建与运行说明、示例配置、第三方依赖说明，以及发布前确定的开源许可证；签名和企业分发流程不作为首版开发或验收前提。\n"}, {"id": "12.1", "title": "验收环境与样本", "line": 412, "depth": 3, "end": 419, "text": "### 12.1 验收环境与样本\n\n至少一台 Windows x64 的真实或受支持虚拟测试环境，记录系统、CPU、内存、Pi/JDT-LS/Java 版本及网络条件。仅在开发机器启动或仅产出安装文件不算 Windows 安装验收。\n\n建立不少于 18 个小型安全样例：三个内置模板各至少 2 个风险成立、2 个有效阻断样例，另补 6 个调用歧义、缺依赖、循环或防护不明的样例。配合一个可固定版本的真实 Java/Spring 项目，验证完整流程。\n\n开发与验收样例分离，样例结论由项目负责人标注。先在固定参考模型上评测，再由测试人员手动配置一个可用免费模型进行兼容性验证；记录模型、模板、规则、源码和查询后端版本。首版样本较小，只形成试用基线，不据此宣称普遍准确率。\n"}, {"id": "12.2", "title": "必交功能验收", "line": 420, "depth": 3, "end": 436, "text": "### 12.2 必交功能验收\n\n| 编号 | 场景 | 通过条件 |\n| --- | --- | --- |\n| A01 | Windows x64 新环境安装 | 安装包可启动；按设计自动准备 Pi 和查询工具，标准流程不要求手工修改代码 |\n| A02 | 两种项目输入 | 本地及公开 GitHub 均完成分析，记录快照或 commit，报告位置一致 |\n| A03 | 默认查询独立运行 | 未安装 LSP 时仍可完成候选发现、分析、图形和报告 |\n| A04 | Java LSP 真实接入 | 在受支持项目中完成定义/引用和跨文件调用定位，并参与至少一条最终风险路径 |\n| A05 | 多语言架构 | 存在语言配置/服务器管理/统一查询边界；业务流程无硬编码的全局 Java 单服务器假设 |\n| A06 | 自定义审计配置 | 能选择模板、编辑并保存提示词；配置进入真实分析；规则导入错误可定位 |\n| A07 | Loop & Goal | 多轮取证至结论；目标、进度可观察；停止、预算和无进展限制实际生效 |\n| A08 | 图与报告 | 列表、图、源码及报告联动；HTML 离线可查看图形与证据；JSON 与界面结论一致 |\n| A09 | 手动模型配置与教程 | 用户可按教程完成配置；保存不触发调用；仅主动测试连接；不自动拉取模型列表或切换模型；确认前不发送源码 |\n| A10 | 中断和恢复 | 风险点边界结果保留，重启后可继续；未提交风险点明确重跑，已提交结果不重复计数 |\n| A11 | 执行与数据边界 | 指定注入和越界用例不执行目标仓库指令、不修改源码、不泄露凭据 |\n| A12 | 故障与降级 | LSP 启动/索引失败、模型错误、断网均有原因和下一步；缺关键证据时保持待定 |\n"}, {"id": "12.3", "title": "分析质量验收", "line": 437, "depth": 3, "end": 444, "text": "### 12.3 分析质量验收\n\n分开测量候选 Sink 发现、调用边正确性、污点判定和证据定位，不以“任务完成”替代质量检查。\n\n首版质量基线：验收样例中声明支持的 Sink 全部命中；简单正反例得到预期结论；关键依赖缺失、超时和调用歧义不错误判为安全；所有输出引用均可定位；真实项目至少展示一条经人工复核的风险或阻断路径。\n\n上述基线用于首版支持范围内的小规模验证。每个样例运行三次，记录通过数、未知数和失败原因，作为验收附件；未达到基线的用例应修复或明确列入未支持范围。普遍准确率需在扩大样本集后独立评估。\n"}, {"id": "12.4", "title": "性能和稳定性", "line": 445, "depth": 3, "end": 452, "text": "### 12.4 性能和稳定性\n\n- 参考仓库和机器在技术验证后固定；模型耗时、LSP 索引耗时与本地 UI 响应分别记录。\n- 100 个候选条目和 50 节点当前路径图可用，长时间查询不阻塞界面。\n- 停止请求 2 秒内得到界面确认，5 秒内停止派发新工作；外部请求取消失败时明确显示等待状态。\n- 完成一次至少 1 小时连续运行和一次进程中断恢复测试，无未受控循环和已提交结果丢失。\n- 外部模型可用性和额度不作为产品可控制的扫描时长承诺；固定参考样例记录耗时、请求数与 Token。\n"}, {"id": "12.5", "title": "首版交付物", "line": 453, "depth": 3, "end": 458, "text": "### 12.5 首版交付物\n\nWindows x64 安装包、源码与锁定依赖、内置模板和 Skills、测试/兼容矩阵、样例项目或可获取说明、示例图形与 HTML/JSON 报告、用户操作说明和已知限制。\n\n首版按开源项目发布，提供未签名的 Windows x64 安装包。发布材料包含 README、构建与运行说明、示例配置、第三方依赖说明，以及发布前确定的开源许可证；签名和企业分发流程不作为首版开发或验收前提。\n"}, {"id": "13", "title": "风险管理与后续规划", "line": 459, "depth": 2, "end": 471, "text": "## 13. 风险管理与后续规划\n\n| 风险 | 影响 | 处理 |\n| --- | --- | --- |\n| 开发经验与关键适配复杂度不匹配 | 实际工期出现波动 | 项目负责人参与关键验证与骨架，开发工程师按小任务集成；按阶段成果调整节奏 |\n| Windows 测试环境不足 | 安装及运行问题发现较晚 | 尽早准备 Windows x64 环境，阶段内持续验证安装和真实运行 |\n| LSP 构建与运行时差异 | 安装/索引失败、结果遗漏 | 锁定支持矩阵，显式暴露索引和降级状态 |\n| 用户配置模型的能力或配额不满足任务 | 长任务中断、结果差异 | 主动连接测试、明确错误、有限重试和检查点；由用户调整模型配置 |\n| 提示词扩展被误认为完整漏洞覆盖 | 用户预期失真 | 模板区分发现规则与分析增强；显示已验证范围 |\n| 调用关系与污点关系混淆 | 错误风险结论 | 保存调用位置和数据映射，未知关系保持待定 |\n\n首版之后优先根据蓝队试用结果扩大模板与 Java 构建覆盖，再逐项增加语言服务器、CodeGraph、精细恢复、私有仓库和增量分析。团队协作、集中策略与更强隔离按企业部署需求独立规划。\n"}, {"id": "14", "title": "发布与交付标准", "line": 472, "depth": 2, "end": 485, "text": "## 14. 发布与交付标准\n\n首版按开源项目发布，交付 Windows x64 安装包、完整源码、锁定依赖、内置三类漏洞模板、Skills、构建说明、模型配置教程、示例报告和测试记录。\n\n发布前满足以下条件：\n\n1. P0 功能完成，核心路径从安装、导入到图形与报告可完整执行。\n2. Java LSP 和默认文本查询分别完成真实项目验证，故障与降级状态可观察。\n3. 固定验收样例完成质量评估，结果与已知限制如实记录。\n4. 无阻断安装、任务执行、证据查看和报告导出的缺陷。\n5. 模型凭据、源码发送、目标代码执行边界及报告渲染通过对应测试。\n6. 开源许可证与第三方依赖说明齐备，README 包含运行环境、构建步骤、使用方法和限制。\n\n安装包采用未签名方式交付，签名与企业分发流程不作为首版发布条件。具体支持的 Windows 版本、Java/JDT-LS 版本与项目构建场景以随包兼容矩阵为准。"}], "text": "# Agent 源码审计客户端 PRD\n\n版本：v1.0｜日期：2026-10-16｜适用范围：首版产品\n\n本文定义 Agent 源码审计客户端首版的产品目标、功能范围、交互流程、技术架构、开发安排和验收标准，供产品、研发与测试实施使用。\n\n## 1. 背景与产品定位\n\n企业蓝队在源码审计时，需要从危险函数出发，寻找外部输入入口，逐层核对参数、返回值、字段与防护逻辑，最终整理可复核的风险证据。扫描工具能提供线索，但调用链追踪、误报排查和报告编写仍占用大量人工时间。\n\n产品通过本地语言服务器提供代码导航，由 Agent 根据污点传播规则分析调用链。客户端使用 Pi 承载 Agent，通过扩展实现 Loop & Goal 调度，以 CLI + Skill 提供代码查询和审计能力。\n\n**产品定位：面向企业蓝队、帮助审计人员发现并复核源码风险路径的桌面工具。** 首版以单人本地工作流服务企业审计场景，团队账号、集中权限和云端协作不属于首版范围。\n\n产品价值以减少人工查证和证据整理时间衡量。首版输出的是静态证据支持的风险判断，不包含动态利用验证。\n\n## 2. 产品目标与用户场景\n\n### 2.1 产品目标\n\n1. 缩短企业蓝队从候选风险点定位到调用路径复核的时间。\n2. 自动整理外部输入、参数传播、防护逻辑和危险操作之间的源码证据。\n3. 提供列表、路径图、源码与报告联动的审计工作台。\n4. 支持用户选择审计模板、配置提示词和模型，保留人工复核入口。\n5. 通过统一查询接口和语言配置预留多语言扩展能力。\n\n首版效果通过固定样例和真实项目试用评估，记录人工复核耗时、有效风险数、证据不足数量及报告完整性。\n\n### 2.2 目标用户与使用场景\n\n| 用户 | 使用场景 | 预期结果 |\n| --- | --- | --- |\n| 企业蓝队审计人员 | 对新项目进行安全初审 | 发现候选风险点并确定优先复核路径 |\n| 企业蓝队审计人员 | 深入核查某条风险路径 | 查看输入来源、传播映射、防护判断和源码证据 |\n| 企业蓝队审计人员 | 补充业务知识或特殊审查要求 | 使用项目提示词和规则配置增强分析 |\n| 企业蓝队审计人员 | 整理审计成果 | 保存人工结论并导出带图形与证据的报告 |\n\n### 2.3 产品概览\n\n| 项目 | 首版定义 |\n| --- | --- |\n| 客户端 | Electron 桌面应用，Windows x64 |\n| 项目输入 | 公开 GitHub 仓库链接、本地源码目录 |\n| 审计范围 | Java / Spring；SQL 注入、命令注入、路径遍历 |\n| Agent | Pi 基座，自研扩展实现 Loop & Goal |\n| 代码查询 | 默认 grep/rg；可选 Java LSP，首版交付 JDT-LS 接入 |\n| 工具形式 | CLI + Skill，预留多语言 LSP 和 CodeGraph 适配 |\n| 模型配置 | 用户手动填写服务地址、API Key 和模型 ID；提供 OpenRouter 引导教程 |\n| 核心输出 | 风险列表、调用路径图、源码证据、HTML/JSON 报告 |\n| 发布方式 | 开源源码及未签名 Windows x64 安装包 |\n\n## 3. 产品范围与需求优先级\n\n### 3.1 首版交付目标\n\n用户在 Windows 安装后，可自动准备 Pi 和基础工具，配置模型，从 GitHub 或本地导入 Java/Spring 项目；选择审计能力后，系统发现候选风险点，通过 Pi 循环取证，使用 Java LSP 或基础文本查询补充调用关系，最终展示可点击源码的路径图并导出报告。\n\n首版提供企业蓝队可试用的完整工作流，覆盖项目导入、风险点发现、循环分析、证据查看、人工复核和报告导出。\n\n### 3.2 功能优先级\n\nP0 为首版交付范围，P1 为后续增强。迭代按阶段成果评估进度。\n\n| 能力 | 首版要求 | 后续增强 |\n| --- | --- | --- |\n| 安装与环境 | Windows x64 安装包；应用独立管理 Pi、rg；Java LSP 依赖按需自动准备 | 其他平台与更多架构、离线安装包、自动升级 |\n| 项目导入 | 本地目录、公开 GitHub URL，绑定源码版本或快照 | 私有仓库鉴权、增量分析 |\n| 审计配置 | 内置 SQL 注入、命令注入、路径遍历模板；可选择、编辑补充提示词并保存本地配置 | 团队模板共享、模板市场 |\n| 风险点发现 | 内置版本化 Sink 规则、规则配置文件导入、手工指定风险点 | 可视化规则编辑器、外部扫描器接入 |\n| Agent | Pi 扩展式 Goal/Loop，单任务、风险点依次处理 | 多任务并发、多 Agent 协作 |\n| 查询 | 默认 rg；Java/JDT-LS 的定义、引用与调用查询适配 | 更多语言服务器、CodeGraph |\n| 分析 | 当前支持模板下的参数、赋值、返回值和基础字段传播；检查相关防护 | 更复杂框架建模、堆对象与跨语言数据流 |\n| 可视化 | 风险列表、按路径查看的调用图、源码与证据联动 | 大图探索、图布局编辑、全仓库图 |\n| 报告 | 页面报告及 HTML 导出；同时保存结构化 JSON | Markdown、PDF、SARIF、企业报告模板 |\n| 控制与恢复 | 停止、预算上限、结果持久化、从风险点边界续跑 | 精细暂停、函数级恢复和历史版本对比 |\n| 复核 | 结论备注，未复核/确认/误报/待补充状态 | 团队审批、多人协作 |\n\n### 3.3 支持边界\n\n首版以受支持的 Java/Spring 项目及明确配置的漏洞类型为范围。复杂反射、运行时动态分派、深层跨依赖调用、跨语言传播、任意构建系统和未支持语言均应显示未覆盖项。\n\n以普通 Maven 项目和固定 Java/Spring 样例建立首版支持矩阵，发布材料记录经过验证的项目、JDK 和语言服务器版本。Gradle、多模块与特殊构建插件依据实测标注支持情况。\n\n首版不接入私有 GitHub 仓库鉴权；用户已拉取的源码可通过本地目录分析。macOS、Linux 客户端、团队协作、自动修复和动态利用验证不纳入首版范围。\n\n### 3.4 功能需求索引\n\n| 编号 | 功能需求 | 优先级 | 对应验收 |\n| --- | --- | --- | --- |\n| FR-01 | Windows x64 安装、Pi 与工具环境准备 | P0 | A01 |\n| FR-02 | 本地目录与公开 GitHub 导入、源码快照 | P0 | A02 |\n| FR-03 | 手动模型配置、OpenRouter 教程、主动连接测试 | P0 | A09 |\n| FR-04 | 三类内置漏洞模板、提示词增强与规则导入 | P0 | A06 |\n| FR-05 | 候选 Sink 扫描与手工指定风险点 | P0 | A02、A06及分析质量验收 |\n| FR-06 | 默认文本查询独立运行 | P0 | A03 |\n| FR-07 | Java LSP 语义查询与后端降级 | P0 | A04、A12 |\n| FR-08 | 多语言服务器注册与统一查询边界 | P0 | A05 |\n| FR-09 | Loop & Goal、预算控制和结构化证据 | P0 | A07 |\n| FR-10 | 风险列表、路径图、源码联动 | P0 | A08 |\n| FR-11 | 人工复核、HTML 与 JSON 报告 | P0 | A08 |\n| FR-12 | 停止、风险点级恢复及异常处理 | P0 | A10、A12 |\n\n## 4. 用户流程与交互\n\n### 4.1 主要使用流程\n\n1. 启动客户端，自动检查并准备 Pi、基础工具和应用自带扩展。\n2. 阅读模型配置引导，手动填写服务地址、API Key 和模型 ID，按需主动测试连接。\n3. 导入 GitHub 链接或本地源码目录，预检语言、规模和构建信息，生成任务快照。\n4. 选择审计模板，按需补充提示词，选择基础查询或 Java LSP。\n5. 查看数据发送说明并确认模型配置，开始分析。\n6. 查看风险列表、当前调查目标和活动记录，展开路径及源码证据。\n7. 标注人工复核结果，导出完整或阶段报告。\n\n用户对同一项目、模型与发送范围的确认可复用；切换到超出原授权范围的模型服务时重新确认，不要求每一轮模型调用都确认。\n\n### 4.2 首次启动与环境准备\n\n显示环境检查、下载、安装、启动和失败原因。Pi 在应用管理目录安装固定版本，加载应用提供的扩展与 Skills，不覆盖用户已有 Pi 环境。\n\n基础模式不依赖 Java LSP。用户选择 LSP 后，再检查 JDT-LS 及其所需 Java 运行时，展示具体下载和索引状态；运行时版本依据锁定的语言服务器验证。\n\n自动准备失败可重试或切换基础查询。产品不得要求用户先手工执行一套未在界面说明的终端操作才能完成标准路径。\n\n### 4.3 项目导入\n\n**本地目录：** 选择目录，展示支持语言、忽略目录、文件规模、可识别构建文件。固定源码快照，包括未提交修改；记录快照标识和文件内容摘要。\n\n**GitHub：** 输入链接，解析仓库和分支/提交，下载到应用管理目录并固定 commit。优先复用可用 Git 环境；缺失时通过环境准备流程处理并显示状态。安装验收覆盖无预装 Git 的标准导入路径。\n\n目录无权限、仓库不存在、网络失败和语言不支持分别显示原因。混合语言仓库明确列出本次分析范围与跳过部分。\n\n### 4.4 审计配置\n\n用户可选择漏洞模板，编辑“补充审查要求”，例如重点检查某种编码方式、业务封装或输入来源。高级配置支持导入自定义 Source/Sink/防护规则，以及手工指定待分析风险点。\n\n首版不做完整规则编辑器，配置文件需要模式校验、错误定位和示例。只有提示词、没有可识别 Sink 或手工风险点时，界面显示“分析增强配置”，不声称已具备该漏洞的自动发现能力。\n\n### 4.5 工作台\n\n| 区域 | 主要内容与操作 |\n| --- | --- |\n| 顶部 | 源码版本、当前阶段、模型、查询后端、用量、停止/续跑 |\n| 风险列表 | 类型、位置、严重程度、分析状态、人工复核状态；筛选和排序 |\n| 路径图 | Source、函数、Sink、防护节点，选择不同路径，点击节点和边查看证据 |\n| 源码面板 | 文件、行号、函数体、调用位置、参数映射及证据摘要 |\n| 活动区 | 当前 Goal、查询摘要、分析进度、错误及预算事件 |\n\n首版每次重点展示一条路径及必要分支，不默认绘制整个仓库调用图。图形为必交输出，但拖拽编辑、大图自动布局和自由画布不进入首版验收。\n\n进度显示已发现、待分析、分析中、已结束的数量和当前阶段。候选集变化时不展示不准确的全局百分比。\n\n### 4.6 风险状态与复核\n\n| 机器路径状态 | 含义 |\n| --- | --- |\n| 待分析 / 分析中 | 尚未形成路径结论 |\n| 风险成立（静态证据支持） | 在声明范围和假设下，外部可控数据可到达危险参数，未发现有效阻断 |\n| 路径已阻断 | 当前路径有明确的不传播或有效防护证据 |\n| 证据不足 | 关键调用关系、源码、依赖或路径条件未解决 |\n| 无效调用链 | 有证据表明某条调用关系不成立 |\n\n风险点与路径分别保存状态：一条路径成立即存在风险；尚有未知或未完成路径时，不能汇总为安全。全部已分析路径被阻断时，显示“当前已分析路径未发现有效风险”，同时显示覆盖限制。\n\n严重程度与证据充分程度分开表达，不展示未经校准的百分比置信度。人工复核保留独立状态与备注，不覆盖机器结论。\n\n### 4.7 报告\n\n报告包含项目版本、审计范围、模板/规则/Skill/Pi/模型版本、实际使用后端、任务结束原因、发现汇总、路径图、源码证据、防护分析、未解决问题、人工复核及修复建议。\n\n首版使用同一报告数据生成页面和 HTML，HTML 内嵌必要图形及样式，导出后无需运行客户端也可查看；同时保留 JSON。停止或预算耗尽时可导出阶段报告，明确标识结果不完整。\n\n报告中的源码位置绑定快照。源码、模型文本和用户备注均转义，导出文件不包含 API Key。\n\n## 5. 漏洞审计能力的配置设计\n\n### 5.1 配置层次\n\n| 层次 | 作用 | 首版实现 |\n| --- | --- | --- |\n| 通用审计规则 | 要求可追溯证据、未知处理、结构化结果 | 应用自带并版本化 |\n| 语言/框架配置 | 识别入口、符号、参数绑定与框架约定 | Java/Spring 配置；预留其他语言包 |\n| 漏洞模板 | Source、Sink、相关参数、防护语义、分析指令、报告字段 | 内置少量模板，支持文件导入 |\n| 项目补充提示词 | 补充业务封装、审计重点和特殊判断要求 | 文本编辑、保存为本地配置 |\n\n提示词可以增强分析，发现范围还受规则和查询能力限制。鉴权缺失、业务逻辑漏洞等不能一律建模成 Source 到 Sink 的污点路径；后续可提供其他 Goal 类型，首版不据此宣称覆盖所有常见 Web 漏洞。\n\n### 5.2 模板数据\n\n模板字段包括：模板 ID、版本、名称、支持语言/框架、Source 规则、Sink 规则及危险参数位置、防护说明、审计提示词、输出要求和测试样例。\n\n用户自定义模板保存为本地版本化文件，任务记录使用的具体版本。模板只提供声明式配置和提示词，不作为可执行 Pi 扩展加载；模板内的文字不能修改工具权限或结果模式。\n\n首版内置 SQL 注入、命令注入、路径遍历三个模板及对应正反例。新模板未经样本验证时标记“自定义/未验证”，与内置已验证能力区分。\n\n## 6. 技术选型与组件职责\n\n以下为首版技术方案，具体依赖版本在工程验证阶段锁定并记录。\n\n| 模块 | 技术方案 | 职责 |\n| --- | --- | --- |\n| 桌面 | Electron + TypeScript | 窗口、受控 IPC、Windows 安装包；平台相关逻辑集中封装，便于后续适配 |\n| 界面 | React + Vite | 配置、任务和风险工作台 |\n| 图形 | React Flow 类库 | 按路径绘图；首版控制图规模 |\n| 源码 | 只读源码查看组件 | 优先轻量组件，Monaco 不是首版必需依赖 |\n| Agent | 固定版本 Pi，优先 RPC 接入 | 界面通过适配层管理进程及事件 |\n| 调度 | 自研 Pi 扩展 | Goal、循环继续条件、预算、结构化结果提交 |\n| 查询 | 统一 CLI；内置 rg + Java LSP 适配 | Skill 描述如何使用，CLI 实际执行查询 |\n| 状态 | SQLite + 源码快照/产物目录 | 任务、工作项、证据、结果和风险点边界恢复 |\n| 报告 | 结构化数据 + 共用 HTML 模板 | 页面、HTML 和 JSON 保持一致 |\n| 打包 | 成熟 Electron 打包工具，早期验证 | 按 Windows x64 准备运行时和二进制；首版不接入签名流程 |\n\nPi 官方提供可扩展机制及 RPC/SDK 接入方式，本产品通过扩展实现审计工作流；具体事件和接口以锁定版本验证。参考：[Pi 仓库](https://github.com/earendil-works/pi)、[扩展文档](https://github.com/earendil-works/pi/blob/main/packages/coding-agent/docs/extensions.md)、[RPC 文档](https://github.com/earendil-works/pi/blob/main/packages/coding-agent/docs/rpc.md)。\n\n首版仅交付 Windows x64，平台相关能力集中封装。其他平台适配独立迭代，详情参考[安装包分发文档](https://www.electronjs.org/docs/latest/tutorial/application-distribution)。\n\n### 6.1 组件关系\n\n```text\nElectron 工作台\n    │ 受控 IPC\n本地应用服务\n    ├─ 环境准备 / 源码导入与快照 / 数据与报告\n    └─ Pi 进程适配层\n         └─ 审计扩展：Goal & Loop\n              ├─ 审计模板与 Skills\n              ├─ 状态与证据存储接口\n              └─ 受控 CLI\n                   ├─ 默认 rg / 源码读取\n                   ├─ LSP 查询 → 按语言选择服务器\n                   └─ CodeGraph 接口预留\n```\n\n调度的业务规则由审计扩展维护；应用服务负责生命周期、状态存储接口和事件分发，避免界面和扩展各自维护一套不同的任务状态。\n\n### 6.2 CLI 与 Skill 契约\n\n统一 CLI 提供能力查询、文本搜索、读取、符号定位、定义、引用、调用者和被调用者查询。各后端可只支持部分能力；返回值必须区分成功无命中、结果不完整、索引未就绪、超时和不支持。\n\n返回数据包含任务/快照 ID、语言、后端、文件位置、完整符号标识、调用位置、证据来源、截断标记及错误。文本同名匹配只产生候选关系，后续需结合源码或语义查询核实。\n\nSkill 按通用审计、漏洞模板、查询后端组织，按需加载；执行逻辑、凭据和预算控制不依赖提示词实现。\n\n## 7. 多语言 LSP 架构与 Java 首次接入\n\n### 7.1 多语言设计要求\n\n语言扩展包同时描述文件识别、框架规则、入口/Sink 模式及查询适配。LSP 本身只提供代码导航等语义能力，不被当作污点分析引擎。\n\n| 模块 | 职责 |\n| --- | --- |\n| 语言配置注册表 | languageId、扩展名、项目根识别、运行时要求、服务器版本与启动参数 |\n| 服务器管理器 | 按项目根、语言和配置启动/复用服务器，处理启动、索引、超时与退出 |\n| 能力协商 | 根据服务器实际能力选择定义、引用、实现、调用层次等请求 |\n| 位置适配 | 处理文件 URI、范围和位置编码，转换到统一源码引用格式 |\n| 结果适配 | 将不同服务器返回值转为统一符号、调用边及查询状态 |\n| 语言规则包 | 将语言/框架语义用于 Source、Sink、传播和防护分析 |\n\n同一仓库可包含多个语言和项目根；设计不使用“每个应用只有一个全局语言服务器”的假设。首版只实现 Java 配置及 JDT-LS 适配，其他语言显示不支持，不自动下载所有服务器。\n\n跨语言调用关系不因注册了多个服务器就视为已解决；后续需要专门的桥接规则。\n\n### 7.2 Java LSP 首版要求\n\n1. 自动检测或准备语言服务器运行环境，启动固定版本 JDT-LS。\n2. 识别受支持项目根，显示启动、导入、索引及错误信息。\n3. 查询定义和引用，结合函数范围识别调用位置；调用层次请求在能力可用时使用。\n4. 在至少一个跨文件 Java 样例上获得真实语义查询结果，并参与最终风险路径分析。\n5. 索引不完整或查询失败时记录覆盖缺口，可降级为文本搜索；不直接作安全结论。\n6. 常驻服务由 CLI 背后的本地管理进程复用，避免每次命令重新启动和索引。\n\n实现时不以一次诊断通知作为整个工作区索引完成的证明，也不承诺 LSP 能完全解析动态分派和反射。参考：[LSP 规范](https://microsoft.github.io/language-server-protocol/specifications/lsp/3.17/specification/)、[JDT-LS 仓库](https://github.com/eclipse-jdtls/eclipse.jdt.ls)。\n\n## 8. Loop & Goal 工作机制\n\n### 8.1 目标与循环\n\n项目 Goal 固定源码范围、漏洞模板、预算与结束条件。每个候选 Sink 生成调查工作项，按需增加查找入口、确认调用目标、核实防护等子项。首版单任务串行处理，不要求多 Agent。\n\n单轮流程：领取工作项 → 加载相关证据摘要 → 按需查询源码/LSP → 分析当前传播或防护问题 → 提交结构化证据与状态 → 校验并持久化 → 判断继续或结束。\n\n调用关系和污点传播分别保存。污染状态不能只有参数布尔数组，至少记录来源、参数/变量/字段位置、传播类型、目标位置、路径条件及防护证据。遇到缺失源码或调用歧义时允许证据不足。\n\n### 8.2 首版结束条件\n\n- 所有已派发工作项已形成结论或明确未解决原因。\n- 用户停止；保留已提交结果，允许生成阶段报告。\n- 到达时间、模型请求数、Token、深度或分支预算；停止继续扩展并列出剩余项。\n- 同一问题重复查询且没有新增证据，结束当前分支为证据不足。\n- 模型/工具短暂错误有限重试；持续错误保存任务，等待用户处理。\n\n单次会话结束不自动等于项目 Goal 完成。继续条件和预算由扩展代码检查；模型输出“已完成”仍须通过工作项与证据校验。\n\n### 8.3 持久化与恢复\n\n首版在风险点完成或明确中断时提交检查点。崩溃后保留已完成风险点，重跑当时尚未提交的风险点；界面说明恢复粒度及可能重复产生的模型用量。\n\n新源码或更换审计配置创建新任务，恢复任务使用原快照和配置。精细到函数或单次模型响应的无损恢复作为后续增强。\n\n## 9. 模型配置与 OpenRouter 使用引导\n\n### 9.1 配置原则\n\n模型由用户自行选择和配置。客户端不自动拉取模型目录，不自动发现免费模型，不自动推荐、选择或切换模型，也不为用户创建账号或提供公共 Key。\n\n设置页提供服务名称、Base URL、API Key、模型 ID，以及保存、编辑、删除和测试连接操作。用户可配置受支持的模型供应商、企业网关或本地模型接口；兼容性以经过验证的接口和工具调用能力为准。\n\n### 9.2 OpenRouter 引导教程\n\n教程可从首次配置页和设置页打开，包含以下步骤：\n\n1. 访问 OpenRouter 官网，自行注册或登录账号。\n2. 在 OpenRouter 控制台创建 API Key，并查看账号可用额度和限制。\n3. 在 OpenRouter 模型页面选择适合审计任务的模型，复制准确的模型 ID；如需免费模型，由用户在官方页面自行选择。\n4. 在客户端填写服务名称、官方文档提供的 Base URL、API Key 和模型 ID。\n5. 点击“测试连接”，确认接口及工具调用可用，保存配置。\n6. 创建审计任务时选择已保存的配置，阅读数据发送说明并开始分析。\n\n教程提供文本说明、填写示例和官方链接，不保存实际密钥。示例模型 ID 使用占位符，不预填某个实时模型。参考：[OpenRouter 快速开始](https://openrouter.ai/docs/quickstart)、[鉴权说明](https://openrouter.ai/docs/api_reference/authentication)、[免费变体说明](https://openrouter.ai/docs/guides/routing/model-variants/free)。\n\n### 9.3 连接测试与配置保存\n\n连接测试只在用户主动点击后执行，使用不含项目源码的固定样例。结果区分地址或网络错误、鉴权失败、模型不存在、额度不足、限流和工具调用不兼容，并提供处理说明。连接测试可能产生少量调用用量，按钮附近说明这一点。\n\n保存配置不触发模型调用。Key 使用系统凭据存储，界面只显示掩码；报告和普通日志不包含凭据。更换模型由用户主动编辑或选择配置，客户端不自动替换模型。\n\n### 9.4 源码发送与错误处理\n\n首次向选定服务发送项目源码前，展示服务地址、模型、发送内容类别及数据政策链接，由用户确认。同一项目、服务及发送范围的授权可复用，超出范围时重新确认。OpenRouter 各提供方的数据处理政策不同，教程提供[数据政策说明](https://openrouter.ai/docs/guides/privacy/provider-logging)。\n\n模型服务错误有限重试；遇到 429 按服务端提示和有限退避处理，额度耗尽时保存进度。用户可以修正配置或主动更换模型后继续；任务记录实际使用模型。配额与可用性参考[官方限额说明](https://openrouter.ai/docs/api_reference/limits)。\n\n分析验收固定参考模型与调用配置，记录模型实际标识及工具调用适配结果。用户自行配置的其他模型不自动继承参考模型的质量评价。\n\n## 10. 数据与非功能要求\n\n### 10.1 核心数据\n\n| 对象 | 至少保存 |\n| --- | --- |\n| ProjectSnapshot | 项目来源、commit/快照 ID、文件摘要、忽略范围 |\n| AuditProfile | 语言/框架、模板及版本、补充提示词、模型和查询配置 |\n| ScanRun / Goal | 任务状态、工作项、预算、实际用量、结束原因、检查点 |\n| CandidateSink | 规则、危险参数、文件范围、源码版本 |\n| CallEdge / TaintEvidence | 符号、调用位置、数据映射、来源后端、确认状态、防护与未解决项 |\n| Finding / Review | 路径结论、严重程度、证据摘要、人工复核及备注 |\n| Report | 导出时结果快照、生成时间、过滤条件 |\n\n### 10.2 执行与数据边界\n\n目标仓库内的说明、注释、AGENTS.md、Skill 文件均作为分析材料，不自动加载为可信运行指令。只加载应用管理的 Pi 扩展和 Skills。\n\n分析默认不修改用户源码，不启动目标业务。基础查询限制在任务快照和受控缓存内，使用参数化进程调用。Pi 通用写入、编辑和不受限命令执行能力不直接开放给审计任务；CLI + Skill 可通过受控命令工具运行。\n\nJDT-LS 项目导入可能涉及依赖解析或构建，需验证并限制项目插件/脚本执行路径，记录网络与执行行为。仅复制源码到快照并不等于隔离目标代码执行。\n\n应用级工具限制不能宣称为操作系统级沙箱；企业上线前另行验证隔离要求。首版也须通过仓库提示词注入、越界读写和任意命令执行的指定测试。\n\nAPI Key 进入系统凭据存储，日志与报告脱敏。Electron 使用受控预加载桥接和上下文隔离，源码及模型文本按不可信数据渲染。参考：[Electron 上下文隔离](https://www.electronjs.org/docs/latest/tutorial/context-isolation)。\n\n### 10.3 性能与可观测性\n\n记录导入、索引、规则扫描、工具查询、模型调用的耗时、重试和用量。无法获知费用时显示未知或明确标注估算。\n\n首版性能验收基准为 1 万至 5 万行的受支持 Java 项目、100 个候选点、单路径图不超过 50 个节点。超限可选择目录缩小范围；大规模能力后续测量，不预设全仓库性能承诺。\n\n## 11. 开发分工与实施计划\n\n### 11.1 排期原则\n\n以半个月形成可试用首版为目标，参考约 10 个有效工作日安排，不将其视为刚性交付日期。开发工程师承担主要编码工作，项目负责人每天约 2–4 小时参与产品、架构、关键技术与验收；具体工作量与承担方式随进展调整。\n\n首版聚焦 Windows x64、Java LSP、Pi 扩展、可视化和报告。优先复用成熟组件，采用单任务、路径级图形、三个内置漏洞模板、HTML/JSON 报告和风险点级恢复，减少并行建设的内容。\n\n按可运行的阶段成果判断进度：先验证关键依赖，再跑通真实路径，随后完善界面与报告，最后集中处理安装和回归。遇到难点时调整任务拆分、协作方式和预计工期，不用尚未验证的功能替代真实成果。\n\n### 11.2 角色分工\n\n| 负责人 | 主要职责 | 交付与协作方式 |\n| --- | --- | --- |\n| 项目负责人（全栈工程师） | 锁定范围；Pi 扩展和 LSP 关键验证；定义证据模式、规则及正反例；关键代码评审；Windows 验收 | 每天 2–4 小时优先投入风险最高部分；关键适配提供可运行骨架或配对支持 |\n| 开发工程师（初级） | Electron/React 页面、配置表单、项目导入、任务事件展示、列表与路径图、报告模板、打包及常规测试 | 按可运行样例和明确接口拆小任务，逐日提交可演示结果 |\n| 两人共同 | CLI/状态/事件契约、集成、真实项目复核、异常测试 | 每天一次集成；关键适配由项目负责人提供可运行骨架或配对完成 |\n\n不额外假定有独立产品、测试、安全人员。样本标注与人工复核由项目负责人承担，开发工程师整理测试记录和执行回归。\n\n### 11.3 参考阶段与任务顺序\n\n以下以约 10 个有效工作日为参考，可在半个月目标窗口内交错推进。天数为估算，实际安排由两人根据进展调整。\n\n| 阶段 | 参考投入 | 开发工程师主要任务 | 项目负责人重点任务 | 阶段成果 |\n| --- | --- | --- | --- | --- |\n| 1. 工程与关键技术验证 | 约 2 天 | Electron 工程、Windows x64 打包骨架、模型设置与事件展示 | 固定 Pi 版本；跑通扩展继续/终止、模型工具调用、Java LSP 定义/引用 CLI | 安装后可启动客户端，并取得真实 Pi 会话和 Java 跨文件查询结果 |\n| 2. 真实审计闭环 | 约 2 天 | 本地/GitHub 导入、快照、候选列表与任务页面 | 定义扩展、证据与状态骨架；跑通 Source→Sink 路径 | 真实项目、真实工具查询和结构化结论连接起来 |\n| 3. 核心输出与配置 | 约 2 天 | 路径图、源码定位、HTML/JSON 报告、模板配置页 | 完善三类模板及正反例，核实防护与未知状态 | 列表、图、源码与报告一致，三类模板可选择并配置增强 |\n| 4. 安装与运行可靠性 | 约 2 天 | 环境自动准备、Windows 集成、停止/续跑与错误提示 | 验证 LSP 安装/索引失败、模型限流与执行边界 | 从安装到报告完整演练，中断和失败后可处理 |\n| 5. 回归与开源发布准备 | 约 2 天 | 修复、安装包、README、构建说明与示例产物 | 人工复核样本和真实项目，确认已知限制 | 可试用的 Windows x64 安装包、源码及验证记录 |\n\n建议开发初期验证安装与 LSP，避免最后集中处理环境问题；模型设置、列表和报告框架可与关键适配工作交错推进。阶段完成后再更新剩余工作量，保留必要的修复时间。\n\n### 11.4 进度检查与协作\n\n- 技术验证阶段检查 Pi 扩展、Java LSP 和 Windows 安装是否跑通；有阻碍时尽早共同解决。\n- 真实审计闭环完成后再扩展样本和交互，避免界面已齐全但分析链路尚未成立。\n- 核心输出完成后逐步收敛新增需求，将精力转向安装、故障处理和回归。\n- 任务分工可协商。项目负责人优先处理影响整体进度的接口、架构和关键适配，开发工程师按小任务完成编码并持续集成。\n- 聊天、多任务并发、复杂规则编辑、复杂图探索和更多导出格式留到后续；Java LSP、Windows x64 安装包、路径图及报告保留为首版核心。\n- 阶段工期变化及时更新计划；若涉及核心范围调整，再共同确认。\n\n## 12. 测试与验收\n\n### 12.1 验收环境与样本\n\n至少一台 Windows x64 的真实或受支持虚拟测试环境，记录系统、CPU、内存、Pi/JDT-LS/Java 版本及网络条件。仅在开发机器启动或仅产出安装文件不算 Windows 安装验收。\n\n建立不少于 18 个小型安全样例：三个内置模板各至少 2 个风险成立、2 个有效阻断样例，另补 6 个调用歧义、缺依赖、循环或防护不明的样例。配合一个可固定版本的真实 Java/Spring 项目，验证完整流程。\n\n开发与验收样例分离，样例结论由项目负责人标注。先在固定参考模型上评测，再由测试人员手动配置一个可用免费模型进行兼容性验证；记录模型、模板、规则、源码和查询后端版本。首版样本较小，只形成试用基线，不据此宣称普遍准确率。\n\n### 12.2 必交功能验收\n\n| 编号 | 场景 | 通过条件 |\n| --- | --- | --- |\n| A01 | Windows x64 新环境安装 | 安装包可启动；按设计自动准备 Pi 和查询工具，标准流程不要求手工修改代码 |\n| A02 | 两种项目输入 | 本地及公开 GitHub 均完成分析，记录快照或 commit，报告位置一致 |\n| A03 | 默认查询独立运行 | 未安装 LSP 时仍可完成候选发现、分析、图形和报告 |\n| A04 | Java LSP 真实接入 | 在受支持项目中完成定义/引用和跨文件调用定位，并参与至少一条最终风险路径 |\n| A05 | 多语言架构 | 存在语言配置/服务器管理/统一查询边界；业务流程无硬编码的全局 Java 单服务器假设 |\n| A06 | 自定义审计配置 | 能选择模板、编辑并保存提示词；配置进入真实分析；规则导入错误可定位 |\n| A07 | Loop & Goal | 多轮取证至结论；目标、进度可观察；停止、预算和无进展限制实际生效 |\n| A08 | 图与报告 | 列表、图、源码及报告联动；HTML 离线可查看图形与证据；JSON 与界面结论一致 |\n| A09 | 手动模型配置与教程 | 用户可按教程完成配置；保存不触发调用；仅主动测试连接；不自动拉取模型列表或切换模型；确认前不发送源码 |\n| A10 | 中断和恢复 | 风险点边界结果保留，重启后可继续；未提交风险点明确重跑，已提交结果不重复计数 |\n| A11 | 执行与数据边界 | 指定注入和越界用例不执行目标仓库指令、不修改源码、不泄露凭据 |\n| A12 | 故障与降级 | LSP 启动/索引失败、模型错误、断网均有原因和下一步；缺关键证据时保持待定 |\n\n### 12.3 分析质量验收\n\n分开测量候选 Sink 发现、调用边正确性、污点判定和证据定位，不以“任务完成”替代质量检查。\n\n首版质量基线：验收样例中声明支持的 Sink 全部命中；简单正反例得到预期结论；关键依赖缺失、超时和调用歧义不错误判为安全；所有输出引用均可定位；真实项目至少展示一条经人工复核的风险或阻断路径。\n\n上述基线用于首版支持范围内的小规模验证。每个样例运行三次，记录通过数、未知数和失败原因，作为验收附件；未达到基线的用例应修复或明确列入未支持范围。普遍准确率需在扩大样本集后独立评估。\n\n### 12.4 性能和稳定性\n\n- 参考仓库和机器在技术验证后固定；模型耗时、LSP 索引耗时与本地 UI 响应分别记录。\n- 100 个候选条目和 50 节点当前路径图可用，长时间查询不阻塞界面。\n- 停止请求 2 秒内得到界面确认，5 秒内停止派发新工作；外部请求取消失败时明确显示等待状态。\n- 完成一次至少 1 小时连续运行和一次进程中断恢复测试，无未受控循环和已提交结果丢失。\n- 外部模型可用性和额度不作为产品可控制的扫描时长承诺；固定参考样例记录耗时、请求数与 Token。\n\n### 12.5 首版交付物\n\nWindows x64 安装包、源码与锁定依赖、内置模板和 Skills、测试/兼容矩阵、样例项目或可获取说明、示例图形与 HTML/JSON 报告、用户操作说明和已知限制。\n\n首版按开源项目发布，提供未签名的 Windows x64 安装包。发布材料包含 README、构建与运行说明、示例配置、第三方依赖说明，以及发布前确定的开源许可证；签名和企业分发流程不作为首版开发或验收前提。\n\n## 13. 风险管理与后续规划\n\n| 风险 | 影响 | 处理 |\n| --- | --- | --- |\n| 开发经验与关键适配复杂度不匹配 | 实际工期出现波动 | 项目负责人参与关键验证与骨架，开发工程师按小任务集成；按阶段成果调整节奏 |\n| Windows 测试环境不足 | 安装及运行问题发现较晚 | 尽早准备 Windows x64 环境，阶段内持续验证安装和真实运行 |\n| LSP 构建与运行时差异 | 安装/索引失败、结果遗漏 | 锁定支持矩阵，显式暴露索引和降级状态 |\n| 用户配置模型的能力或配额不满足任务 | 长任务中断、结果差异 | 主动连接测试、明确错误、有限重试和检查点；由用户调整模型配置 |\n| 提示词扩展被误认为完整漏洞覆盖 | 用户预期失真 | 模板区分发现规则与分析增强；显示已验证范围 |\n| 调用关系与污点关系混淆 | 错误风险结论 | 保存调用位置和数据映射，未知关系保持待定 |\n\n首版之后优先根据蓝队试用结果扩大模板与 Java 构建覆盖，再逐项增加语言服务器、CodeGraph、精细恢复、私有仓库和增量分析。团队协作、集中策略与更强隔离按企业部署需求独立规划。\n\n## 14. 发布与交付标准\n\n首版按开源项目发布，交付 Windows x64 安装包、完整源码、锁定依赖、内置三类漏洞模板、Skills、构建说明、模型配置教程、示例报告和测试记录。\n\n发布前满足以下条件：\n\n1. P0 功能完成，核心路径从安装、导入到图形与报告可完整执行。\n2. Java LSP 和默认文本查询分别完成真实项目验证，故障与降级状态可观察。\n3. 固定验收样例完成质量评估，结果与已知限制如实记录。\n4. 无阻断安装、任务执行、证据查看和报告导出的缺陷。\n5. 模型凭据、源码发送、目标代码执行边界及报告渲染通过对应测试。\n6. 开源许可证与第三方依赖说明齐备，README 包含运行环境、构建步骤、使用方法和限制。\n\n安装包采用未签名方式交付，签名与企业分发流程不作为首版发布条件。具体支持的 Windows 版本、Java/JDT-LS 版本与项目构建场景以随包兼容矩阵为准。\n"}, "modules": [{"id": "M01", "name": "客户端与环境", "goal": "先建立可承载后续功能的客户端", "summary": "Electron 骨架、Pi 与本地工具", "label": "桌面 / 环境"}, {"id": "M02", "name": "项目与源码", "goal": "让每次分析绑定稳定的源码", "summary": "公开仓库、本地目录与快照", "label": "导入 / 快照"}, {"id": "M03", "name": "模型连接", "goal": "由用户配置和决定模型", "summary": "手动填写、教程、连接测试", "label": "设置 / 引导"}, {"id": "M04", "name": "模板与知识", "goal": "把审计方法写成可复用文档", "summary": "三类模板、Markdown、Skill", "label": "模板 / 编辑器"}, {"id": "M05", "name": "风险点发现", "goal": "从候选 Sink 建立调查目标", "summary": "规则命中、参数位置与手 5 和 A06 仍描述底层规则配置导入。", "resolution": "使用新增模板编辑器，支持 Markdown / SKILL.md / Skill 目录；保留底层发现规则与知识文档的能力边界。", "refs": ["TPL-02", "TPL-03"]}, {"title": "最新原型视觉约束", "source": "未记录冷色主题、配置页右侧空间、hover 与下拉箭头等细节。", "resolution": "作为界面验收细节记录，不膨胀为独立后端模块。", "refs": ["UI-04"]}]}}</script>
<script>
'use strict';
const DATA=JSON.parse(document.querySelector('#requirements-data').textContent),REQS=DATA.requirements,MODULES=DATA.modules;
const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paths={logo:'M4 7l8-4 8 4v11l-8 4-8-4V7Z M4 7l8 5 8-5 M12 12v10 M8 5l8 5',search:'M10 17a7 7 0 1 0 0-14 7 7 0 0 0 0 14Z M15 15l6 6',arrow:'M4 12h16 M14 6l6 6-6 6',check:'M5 12l4 4L19 6',close:'M6 6l12 12 M18 6L6 18',chevron:'M9 5l7 7-7 7'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.arrow}"/></svg>`;
const labels={overview:'需求总览',requirements:'需求列表'};
let state={view:'overview',module:'all',priority:'all',query:''},activeReq=null;
const getReq=id=>REQS.find(r=>r.id===id),getModule=id=>MODULES.find(m=>m.id===id);
function filtered(){return REQS.filter(r=>(state.module==='all'||r.module===state.module)&&(state.priority==='all'||r.priority===state.priority)&&(!state.query||[r.id,r.title,r.description,r.ref,getModule(r.module).name,...r.acceptance].join(' ').toLowerCase().includes(state.query.toLowerCase())))}
function priorityHTML(p){return `<span class="tag ${p.toLowerCase()}">${p==='P0'?'首版 P0':'后续 P1'}</span>`}
function navigation(){document.querySelector('#navigation').innerHTML=Object.entries(labels).map(([id,name])=>`<button data-view="${id}" class="${state.view===id?'active':''}" ${state.view===id?'aria-current="page"':''}>${name}</button>`).join('')}
function closeDetail(){document.querySelector('#detail').hidden=true;activeReq=null;document.querySelectorAll('[data-open]').forEach(el=>el.classList.remove('active'))}
function navigate(view,module){state.view=labels[view]?view:'overview';if(module)state.module=module;closeDetail();if(location.hash!=='#'+state.view)location.hash=state.view;render();window.scrollTo(0,0)}
function overview(){return `<div class="heading"><div><div class="eyebrow">PRODUCT OVERVIEW</div><h1>需求总览</h1><p class="sub">首版范围与模块划分，一页看清。</p></div><button class="btn primary" data-action="all">查看需求列表 ${icon('arrow')}</button></div><section class="intro"><div><h2>从源码出发，输出可复核的风险路径。</h2><p class="sub">面向企业蓝队的源码审计客户端。以 Pi 扩展实现 Goal / Loop，使用 rg 和 Java LSP 查证调用及污染传播，交付路径图、源码证据与审计报告。</p><div class="scope"><span class="tag">Windows x64</span><span class="tag">Java / Spring</span><span class="tag">SQL 注入</span><span class="tag">命令注入</span><span class="tag">路径遍历</span></div></div></section><div class="counts">${[['全部需求',REQS.length],['首版需求',REQS.filter(r=>r.priority==='P0').length],['后续需求',REQS.filter(r=>r.priority==='P1').length]].map(([t,n])=>`<div class="count"><span>${t}</span><strong>${String(n).padStart(2,'0')}</strong></div>`).join('')}</div><div class="section-head"><h2>按模块查看</h2><small>${MODULES.length} 个模块 · 点击进入需求列表</small></div><div class="module-grid">${MODULES.map(m=>{const all=REQS.filter(r=>r.module===m.id),p0=all.filter(r=>r.priority==='P0').length;return `<button class="module-card" data-module="${m.id}"><div class="module-top"><span class="module-id">${m.id}</span><span class="tag">${all.length} 项需求</span></div><h3>${m.name}</h3><p>${m.summary}</p><div class="module-foot"><span>首版 ${p0} 项${all.length>p0?' · 后续 '+(all.length-p0)+' 项':''}</span>${icon('arrow')}</div></button>`}).join('')}</div>`}
function requirements(){const list=filtered();return `<div class="heading"><div><div class="eyebrow">REQUIREMENTS</div><h1>需求列表</h1><p class="sub">点击任意需求，在右侧查看说明与验收条件。</p></div></div><div class="toolbar"><div class="filter-left"><select class="select" id="modulefilter" aria-label="按模块筛选"><option value="all">全部模块</option>${MODULES.map(m=>`<option value="${m.id}" ${state.module===m.id?'selected':''}>${m.name}</option>`).join('')}</select><div class="priority-tabs">${[['all','全部'],['P0','首版'],['P1','后续']].map(([k,l])=>`<button data-priority="${k}" class="${state.priority===k?'active':''}">${l}</button>`).join('')}</div>${state.module!=='all'||state.priority!=='all'||state.query?'<button class="clear" data-action="reset">清除筛选</button>':''}</div><span class="result-count">${list.length} 项需求</span></div>${list.length?`<div class="list"><div class="list-header"><span>编号</span><span>需求</span><span class="header-module">模块</span><span>优先级</span><span></span></div>${list.map(r=>`<button class="requirement-row ${activeReq===r.id?'active':''}" data-open="${r.id}" aria-label="查看 ${escapeHtml(r.title)}"><span class="row-id">${r.id}</span><span style="min-width:0"><span class="row-title">${escapeHtml(r.title)}</span><span class="row-desc">${escapeHtml(r.description)}</span></span><span class="row-module">${getModule(r.module).name}</span>${priorityHTML(r.priority)}${icon('chevron')}</button>`).join('')}</div>`:'<div class="empty"><p>没有匹配的需求。</p><button class="btn" data-action="reset">清除筛选</button></div>'}`}
function render(){navigation();document.querySelector('#content').innerHTML=({overview,requirements}[state.view])()+`<footer class="foot"><span>pi-audit-harness · 产品需求</span><span>只读需求视图 · 不代表研发进度</span></footer>`}
function openDetail(id){const r=getReq(id);if(!r)return;activeReq=id;const m=getModule(r.module),s=DATA.source.sections.find(x=>x.id===r.section),phase=DATA.phases.find(x=>x.id===r.phase);const d=document.querySelector('#detail');d.innerHTML=`<div class="detail-head"><div class="detail-top"><span class="detail-id">${r.id}</span><button class="close" data-action="close" aria-label="关闭需求详情">${icon('close')}</button></div><h2 id="detail-title">${escapeHtml(r.title)}</h2><div class="detail-tags">${priorityHTML(r.priority)}<span class="tag">${m.name}</span></div></div><div class="detail-body"><section class="detail-section"><h3>需求说明</h3><p>${escapeHtml(r.description)}</p></section><section class="detail-section"><h3>验收条件</h3><ul class="acceptance">${r.acceptance.map(a=>`<li>${icon('check')}<span>${escapeHtml(a)}</span></li>`).join('')}</ul></section><div class="detail-facts"><div class="fact"><small>参考职责</small><strong>${r.owner}</strong></div><div class="fact"><small>需求类型</small><strong>${r.kind}</strong></div></div><details class="technical"><summary>实现备注与原文出处</summary><p>参考阶段：${phase?phase.title+'（时间可协商）':'后续迭代'}<br>文档映射：${escapeHtml(r.ref||'§'+r.section)}</p>${r.dependencies.length?`<h3 style="font-size:10px;color:#789ec6;margin-bottom:9px">前置需求</h3><div class="related">${r.dependencies.map(id=>`<button data-related="${id}" title="${escapeHtml(getReq(id).title)}">${id} · ${escapeHtml(getReq(id).title)}</button>`).join('')}</div>`:''}${r.origin==='补充需求'?`<p class="source-note">本项采用最新补充要求，原 PRD 对应章节作为背景参考；具体行为和验收以本项为准。</p>`:''}<h3 style="font-size:10px;color:#789ec6">§${s.id} ${escapeHtml(s.title)} · L${s.line}–L${s.end}</h3><pre class="source-code">${escapeHtml(s.text)}</pre></details></div><div class="detail-bottom">需求资料仅用于阅读与拆解，原始 PRD 未修改。</div>`;d.hidden=false;document.querySelectorAll('[data-open]').forEach(el=>el.classList.toggle('active',el.dataset.open===id));d.querySelector('.detail-body').scrollTop=0}
document.addEventListener('click',e=>{const row=e.target.closest('[data-open]');if(row){openDetail(row.dataset.open);return}const related=e.target.closest('[data-related]');if(related){openDetail(related.dataset.related);return}const view=e.target.closest('[data-view]');if(view){navigate(view.dataset.view);return}const module=e.target.closest('[data-module]');if(module){state.priority='all';state.query='';document.querySelector('#search').value='';navigate('requirements',module.dataset.module);return}const priority=e.target.closest('[data-priority]');if(priority){state.priority=priority.dataset.priority;render();return}const action=e.target.closest('[data-action]');if(!action)return;if(action.dataset.action==='close'){closeDetail();render()}else if(action.dataset.action==='all'||action.dataset.action==='reset'){state.module='all';state.priority='all';state.query='';document.querySelector('#search').value='';navigate('requirements')}});
document.addEventListener('change',e=>{if(e.target.id==='modulefilter'){state.module=e.target.value;render()}});
document.querySelector('#search').addEventListener('input',e=>{state.query=e.target.value.trim();if(state.view!=='requirements'){state.view='requirements';location.hash='#requirements'}render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&activeReq){closeDetail();render()}});
window.addEventListener('hashchange',()=>{const view=location.hash.slice(1);if(labels[view]&&state.view!==view)navigate(view)});
document.querySelector('#logo').innerHTML=icon('logo');document.querySelector('#searchicon').innerHTML=icon('search');if(labels[location.hash.slice(1)])state.view=location.hash.slice(1);render();
</script>
