[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-audit-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.30.0",
    "pydantic==2.12.5",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
